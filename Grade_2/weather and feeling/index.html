<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Feelings & Weather Interactive Lesson</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#183153;background:#dff3ff;overflow:hidden}button{font:inherit;cursor:pointer}.screen{position:fixed;inset:0;background-size:cover;background-position:center;display:none}.screen.active{display:flex;flex-direction:column}.shade{position:absolute;inset:0;background:rgba(255,255,255,.18);pointer-events:none}.top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.92);border-bottom:4px solid #ffd34e}.title{font-weight:1000;font-size:clamp(22px,3vw,38px)}.spacer{flex:1}.navbtn{border:0;border-radius:16px;padding:10px 14px;background:#fff3a2;font-weight:1000;box-shadow:0 4px 0 #d9ad25}.content{position:relative;z-index:2;flex:1;min-height:0;padding:14px;overflow:auto}.panel{background:rgba(255,255,255,.93);border:4px solid #ffd34e;border-radius:26px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.16)}.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.flash{border:0;background:white;border-radius:22px;padding:6px;box-shadow:0 8px 18px rgba(0,0,0,.18);transition:.15s}.flash:active{transform:scale(.97)}.flash img{width:100%;height:28vh;object-fit:contain;border-radius:18px}.subtabs{display:flex;gap:10px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}.tab{border:0;border-radius:18px;padding:10px 16px;font-weight:1000;background:#e8f1ff}.tab.on{background:#ffd95e}.gamebox{max-width:980px;margin:auto;text-align:center}.prompt{font-weight:1000;font-size:clamp(28px,4vw,52px);margin:8px}.choicegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choicegrid img{width:100%;height:30vh;object-fit:contain}.bigCard{max-height:52vh;max-width:min(70vw,520px);object-fit:contain;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.18)}.answers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}.answer{border:0;border-radius:20px;padding:14px 22px;font-size:clamp(20px,2.4vw,32px);font-weight:1000;background:white;box-shadow:0 6px 0 #cad4e4}.good{background:#b8f49d!important}.bad{background:#ffc1c1!important}.memory{display:grid;grid-template-columns:repeat(6,minmax(110px,145px));gap:10px;max-width:930px;margin:auto;justify-content:center;align-items:center}.memory.level3{grid-template-columns:repeat(8,minmax(90px,120px));max-width:1040px}.mcard{aspect-ratio:3/4;width:100%;height:auto;perspective:900px}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.35s}.mcard.flipped .inner,.mcard.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:4px solid #fff;box-shadow:0 7px 16px rgba(0,0,0,.2);display:grid;place-items:center;overflow:hidden}.back{background:#fff}.back img{width:100%;height:100%;object-fit:contain;display:block}.front{transform:rotateY(180deg);background:#fff;padding:4px}.front img{width:100%;height:100%;object-fit:contain;display:block}.score{font-weight:1000}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:20;padding:16px}.overlay.show{display:grid}.modal{background:white;border:6px solid #ffd34e;border-radius:28px;padding:20px;max-width:650px;width:94%;text-align:center}.say{font-size:clamp(34px,5vw,58px);font-weight:1000}.tiny{font-size:15px}.homeMenu{background-image:url('assets/feelings_and_weather_classroom_menu.webp');background-size:cover;background-position:center}.hotspot{position:absolute;border:0;background:rgba(255,255,255,.06);border-radius:26px}.hotspot:hover{outline:5px solid rgba(255,255,255,.65)}#h1{left:21%;top:34%;width:29%;height:18%}#h2{left:51%;top:34%;width:29%;height:18%}#h3{left:21%;top:56%;width:29%;height:18%}#h4{left:51%;top:56%;width:29%;height:18%}#h5{left:34%;top:79%;width:32%;height:14%}.levelBtns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.level{border:0;border-radius:18px;padding:12px 18px;font-weight:1000;background:#fff0a7}.shuffleBtn{background:linear-gradient(180deg,#b8f49d,#76dd65);box-shadow:0 5px 0 #3fae36;padding-left:22px;padding-right:22px}.shuffleBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #3fae36}@media(max-width:900px){.grid6{grid-template-columns:repeat(2,1fr)}.choicegrid{grid-template-columns:repeat(2,1fr)}.memory,.memory.level3{grid-template-columns:repeat(4,minmax(95px,135px));max-width:620px}.flash img{height:24vh}.title{font-size:22px}}@media(max-width:560px){.memory,.memory.level3{grid-template-columns:repeat(3,minmax(85px,120px));gap:8px}}
</style><link rel="preload" href="assets/audio/voice_sprite.mp3" as="fetch" crossorigin>
</head><body>
<div id="home" class="screen active homeMenu"><button id="h1" class="hotspot" onclick="openStage('feel')" aria-label="Feelings"></button><button id="h2" class="hotspot" onclick="openStage('weather')" aria-label="Weather"></button><button id="h3" class="hotspot" onclick="openStage('mix')" aria-label="Mix Together"></button><button id="h4" class="hotspot" onclick="openStage('speak')" aria-label="Speaking Challenge"></button><button id="h5" class="hotspot" onclick="openStage('memory')" aria-label="Memory Game"></button></div>
<div id="feel" class="screen" style="background-image:url('assets/sunlit_weather_themed_classroom.webp')"><div class="shade"></div><div class="top"><div class="title">1 — Feelings</div><div class="spacer"></div><button class="navbtn" onclick="goHome()">🏠 Home</button></div><div class="content"><div class="subtabs"><button class="tab on" onclick="feelMode('learn',this)">Learn</button><button class="tab" onclick="feelMode('find',this)">Find It!</button><button class="tab" onclick="feelMode('sentence',this)">Sentence</button></div><div id="feelBody"></div></div></div>
<div id="weather" class="screen" style="background-image:url('assets/sunlit_weather_themed_classroom.webp')"><div class="shade"></div><div class="top"><div class="title">2 — Weather</div><div class="spacer"></div><button class="navbtn" onclick="goHome()">🏠 Home</button></div><div class="content"><div class="subtabs"><button class="tab on" onclick="weatherMode('learn',this)">Learn</button><button class="tab" onclick="weatherMode('find',this)">Find It!</button><button class="tab" onclick="weatherMode('sentence',this)">Sentence</button></div><div id="weatherBody"></div></div></div>
<div id="mix" class="screen" style="background-image:url('assets/sunny_schoolyard_playground_scene.webp')"><div class="shade"></div><div class="top"><div class="title">3 — Mix Together</div><div class="spacer"></div><button class="navbtn" onclick="goHome()">🏠 Home</button></div><div class="content"><div class="panel gamebox" id="mixBody"></div></div></div>
<div id="speak" class="screen" style="background-image:url('assets/sunny_schoolyard_playground_scene.webp')"><div class="shade"></div><div class="top"><div class="title">4 — Speaking Challenge</div><div class="spacer"></div><button class="navbtn" onclick="goHome()">🏠 Home</button></div><div class="content"><div class="levelBtns"><button class="level" onclick="setSpeakLevel(1)">Level 1 — Choices</button><button class="level" onclick="setSpeakLevel(2)">Level 2 — Question</button><button class="level" onclick="setSpeakLevel(3)">Level 3 — Picture Only</button></div><div class="panel gamebox" id="speakBody" style="margin-top:12px"></div></div></div>
<div id="memory" class="screen" style="background-image:url('assets/cheerful_rainbow_valley_playground.webp')"><div class="shade"></div><div class="top"><div class="title">5 — Find the Pair & Say It!</div><div class="score" id="score">Pairs: 0</div><div class="spacer"></div><button class="navbtn" onclick="goHome()">🏠 Home</button></div><div class="content"><div class="levelBtns"><button class="level" onclick="startMemory(1)">Level 1 — Picture ↔ Word</button><button class="level" onclick="startMemory(2)">Level 2 — Picture ↔ Sentence</button><button class="level" onclick="startMemory(3)">Level 3 — Mixed</button><button class="level shuffleBtn" onclick="replayMemory()">🔀 Shuffle / Play Again</button></div><div id="memoryBoard" class="memory" style="margin-top:12px"></div></div></div>
<div class="overlay" id="sayOverlay"><div class="modal"><div class="say">🎤 SAY IT!</div><img id="sayImg" class="bigCard"><div id="sayQuestion" class="prompt"></div><div class="answers"><button class="answer good" onclick="confirmPair(true)">✓ Correct</button><button class="answer" onclick="speakCurrentSentence()">🔊 Hear</button><button class="answer bad" onclick="confirmPair(false)">↻ Try Again</button></div></div></div>
<script>
const AUDIO_SPRITE_URL='assets/audio/voice_sprite.mp3';
const AUDIO_SPRITE_MAP='assets/audio/voice_sprite_map.json';
let _voiceCtx=null,_voiceBuffer=null,_voiceMap=null,_voiceLoading=null,_voiceSource=null;
function getVoiceCtx(){if(!_voiceCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)_voiceCtx=new A()}if(_voiceCtx&&_voiceCtx.state==='suspended')_voiceCtx.resume();return _voiceCtx}
async function preloadVoiceSprite(){if(_voiceBuffer&&_voiceMap)return true;if(_voiceLoading)return _voiceLoading;_voiceLoading=(async()=>{try{const [ar,mr]=await Promise.all([fetch(AUDIO_SPRITE_URL,{cache:'force-cache'}),fetch(AUDIO_SPRITE_MAP,{cache:'force-cache'})]);if(!ar.ok||!mr.ok)throw new Error('voice asset load failed');const [ab,map]=await Promise.all([ar.arrayBuffer(),mr.json()]);const c=getVoiceCtx();if(!c)throw new Error('Web Audio unavailable');_voiceBuffer=await c.decodeAudioData(ab);_voiceMap=map;return true}catch(e){console.warn('Voice preload failed',e);_voiceLoading=null;return false}})();return _voiceLoading}
function audioKeyForText(t){const x=t.trim().toLowerCase().replace(/[.!?]/g,'');const m={"how are you today":"q_feeling","how's the weather":"q_weather","try again":"try_again","say it":"say_it"};if(m[x])return m[x];if(x.startsWith('find '))return 'find_'+x.slice(5).trim().replace(/\s+/g,'_');if(x.startsWith("i'm "))return 'sent_'+x.slice(4).trim().replace(/\s+/g,'_');if(x.startsWith("it's "))return 'sent_'+x.slice(5).trim().replace(/\s+/g,'_');const wk='word_'+x.replace(/\s+/g,'_');if(_voiceMap&&_voiceMap[wk])return wk;return wk}
async function playVoiceKey(k){await preloadVoiceSprite();const c=getVoiceCtx();const seg=_voiceMap&&_voiceMap[k];if(!c||!_voiceBuffer||!seg){console.warn('No custom voice clip for',k);return}try{if(_voiceSource)_voiceSource.stop()}catch(e){}const s=c.createBufferSource();s.buffer=_voiceBuffer;s.connect(c.destination);_voiceSource=s;s.onended=()=>{if(_voiceSource===s)_voiceSource=null};s.start(0,seg.start,seg.duration)}
function say(t){const k=audioKeyForText(t);playVoiceKey(k)}
// Start the network/decode work early. Playback still begins only after a user gesture.
window.addEventListener('DOMContentLoaded',()=>{preloadVoiceSprite();if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{})}});
let currentPair=null, pendingPair=null, memLock=false, pairs=0, speakLevel=1, speakItem=null, mixItem=null;
let _audioCtx=null;function getAudioCtx(){if(!_audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)_audioCtx=new A()}if(_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume();return _audioCtx}
function beep(ok=true){const c=getAudioCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:220;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){show('home')}
function openStage(id){show(id); if(id==='feel') feelMode('learn'); if(id==='weather')weatherMode('learn'); if(id==='mix')newMix(); if(id==='speak')setSpeakLevel(1); if(id==='memory')startMemory(1)}
function setTab(btn){if(!btn)return;btn.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));btn.classList.add('on')}
function catItems(cat){return DATA.filter(x=>x.cat===cat)}
function learnGrid(cat){return '<div class="grid6">'+catItems(cat).map(x=>`<button class="flash" onclick="say('${x.word}')"><img src="${x.pw}"></button>`).join('')+'</div>'}
function feelMode(m,b){setTab(b);const el=document.getElementById('feelBody');if(m==='learn')el.innerHTML=learnGrid('feeling');else if(m==='find')renderFind('feeling',el);else renderSentence('feeling',el)}
function weatherMode(m,b){setTab(b);const el=document.getElementById('weatherBody');if(m==='learn')el.innerHTML=learnGrid('weather');else if(m==='find')renderFind('weather',el);else renderSentence('weather',el)}
function sample(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function renderFind(cat,el){const all=catItems(cat), target=all[Math.floor(Math.random()*all.length)], choices=sample(all.filter(x=>x!==target),3).concat(target).sort(()=>Math.random()-.5);el.innerHTML=`<div class="panel gamebox"><div class="prompt">🔊 Find <b>${target.word}</b></div><button class="navbtn" onclick="say('Find ${target.word}')">Hear again</button><div class="choicegrid" style="margin-top:12px">${choices.map(x=>`<button class="flash" onclick="checkFind('${x.word}','${target.word}','${cat}')"><img src="${x.pic}"></button>`).join('')}</div></div>`;say('Find '+target.word)}
function checkFind(g,t,cat){if(g===t){beep(true);say(t);setTimeout(()=>renderFind(cat,document.getElementById(cat==='feeling'?'feelBody':'weatherBody')),650)}else{beep(false);say('Try again')}}
function renderSentence(cat,el){const all=catItems(cat),q=cat==='feeling'?'How are you today?':"How's the weather?";el.innerHTML=`<div class="panel gamebox"><div class="prompt">${q}</div><button class="navbtn" data-say="${q}" onclick="say(this.dataset.say)">🔊 Hear question</button><div class="grid6" style="margin-top:12px">${all.map(x=>`<button class="flash" data-say="${x.sentence}" onclick="say(this.dataset.say)"><img src="${x.sentImg}"></button>`).join('')}</div></div>`}
function newMix(){mixItem=DATA[Math.floor(Math.random()*DATA.length)];document.getElementById('mixBody').innerHTML=`<div class="prompt">Feeling or Weather?</div><img class="bigCard" src="${mixItem.pic}"><div class="answers"><button class="answer" onclick="mixChoose('feeling')">😊 Feeling</button><button class="answer" onclick="mixChoose('weather')">🌦️ Weather</button></div>`}
function mixChoose(c){if(c!==mixItem.cat){beep(false);say('Try again');return}beep(true);const q=mixItem.question;document.getElementById('mixBody').innerHTML=`<div class="prompt">${q}</div><img class="bigCard" src="${mixItem.pic}"><div class="answers"><button class="answer" onclick="mixAnswer(true)">${mixItem.sentence}</button><button class="answer" onclick="mixAnswer(false)">${mixItem.cat==='feeling'?"It's ":"I'm "+mixItem.word+'.'}</button></div>`;say(q)}
function mixAnswer(ok){if(ok){beep(true);say(mixItem.sentence);setTimeout(newMix,1100)}else{beep(false);say('Try again')}}
function setSpeakLevel(l){speakLevel=l;newSpeak()}
function newSpeak(){speakItem=DATA[Math.floor(Math.random()*DATA.length)];let extra='';if(speakLevel===1){const wrong=DATA.filter(x=>x.cat!==speakItem.cat)[Math.floor(Math.random()*6)];extra=`<div class="answers"><button class="answer" onclick="teacherSpeak(true)">${speakItem.sentence}</button><button class="answer" onclick="teacherSpeak(false)">${wrong.sentence}</button></div>`}else if(speakLevel===2){extra=`<div class="prompt">${speakItem.question}</div><div class="answers"><button class="answer good" onclick="teacherSpeak(true)">✓ Student said it</button><button class="answer" data-say="${speakItem.question}" onclick="say(this.dataset.say)">🔊 Question</button></div>`}else{extra=`<div class="prompt">🎤 Say the full sentence.</div><div class="answers"><button class="answer good" onclick="teacherSpeak(true)">✓ Correct</button><button class="answer" data-say="${speakItem.sentence}" onclick="say(this.dataset.say)">🔊 Hear answer</button></div>`}document.getElementById('speakBody').innerHTML=`<img class="bigCard" src="${speakItem.pic}">${extra}`;if(speakLevel===2)say(speakItem.question)}
function teacherSpeak(ok){if(ok){beep(true);say(speakItem.sentence);setTimeout(newSpeak,900)}else{beep(false);say('Try again')}}
function replayMemory(){const level=window._memLevel||1; playUi('flip'); startMemory(level)}
function startMemory(level){pairs=0;document.getElementById('score').textContent='Pairs: 0';const selected=sample(DATA, level===3?8:6);window._memSelected=selected;window._memLevel=level;let cards=[];selected.forEach((x,i)=>{cards.push({key:i,item:x,type:'pic'});cards.push({key:i,item:x,type:level===1?'word':(level===2?'sent':(Math.random()<.5?'word':'sent'))})});cards.sort(()=>Math.random()-.5);const b=document.getElementById('memoryBoard');b.classList.toggle('level3',level===3);b.innerHTML=cards.map((c,i)=>`<div class="mcard" data-key="${c.key}" data-i="${i}" onclick="flipMem(this)"><div class="inner"><div class="face back"><img src="assets/memory_card_back_portrait.webp" alt="card back"></div><div class="face front"><img src="${c.type==='pic'?c.item.pic:(c.type==='word'?c.item.wordImg:c.item.sentImg)}"></div></div></div>`).join('');currentPair=null;pendingPair=null;window._pendingItem=null;memLock=false}
function flipMem(el){if(memLock||el.classList.contains('flipped')||el.classList.contains('matched'))return;el.classList.add('flipped');beep(true);if(!currentPair){currentPair=el;return}memLock=true;const a=currentPair,b=el;if(a.dataset.key===b.dataset.key){const idx=Number(a.dataset.key);const target=(window._memSelected||[])[idx];pendingPair=[a,b];window._pendingItem=target||null;document.getElementById('sayImg').src=target?target.pic:'';document.getElementById('sayQuestion').textContent=target?target.question:'Say the word or full sentence aloud.';document.getElementById('sayOverlay').classList.add('show');if(target)setTimeout(()=>say(target.question),120);currentPair=null;memLock=false}else{setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');currentPair=null;memLock=false;beep(false)},700)}}
function getWordFromCard(a,b){return ''}
function confirmPair(ok){if(!pendingPair)return;if(ok){pendingPair.forEach(x=>x.classList.add('matched'));pairs++;document.getElementById('score').textContent='Pairs: '+pairs;beep(true);if(window._pendingItem)say(window._pendingItem.sentence)}else{pendingPair.forEach(x=>x.classList.remove('flipped'));beep(false);say('Try again')}pendingPair=null;window._pendingItem=null;document.getElementById('sayOverlay').classList.remove('show')}
function speakCurrentSentence(){if(window._pendingItem)say(window._pendingItem.sentence);else say('Say it')}
</script></body></html>
