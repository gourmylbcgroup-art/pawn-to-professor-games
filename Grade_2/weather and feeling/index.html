<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Feelings & Weather Interactive Lesson</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;color:#183153;background:#dff3ff;overflow:hidden}button{font:inherit;cursor:pointer}.screen{position:fixed;inset:0;background-size:cover;background-position:center;display:none}.screen.active{display:flex;flex-direction:column}.shade{position:absolute;inset:0;background:rgba(255,255,255,.18);pointer-events:none}.top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.92);border-bottom:4px solid #ffd34e}.title{font-weight:1000;font-size:clamp(22px,3vw,38px)}.spacer{flex:1}.navbtn{border:0;border-radius:16px;padding:10px 14px;background:#fff3a2;font-weight:1000;box-shadow:0 4px 0 #d9ad25}.content{position:relative;z-index:2;flex:1;min-height:0;padding:14px;overflow:auto}.panel{background:rgba(255,255,255,.93);border:4px solid #ffd34e;border-radius:26px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.16)}.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flash{border:0;background:white;border-radius:22px;padding:4px;box-shadow:0 8px 18px rgba(0,0,0,.18);transition:.15s}.flash:active{transform:scale(.97)}.flash img{width:100%;height:32vh;object-fit:contain;border-radius:18px}.subtabs{display:flex;gap:10px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}.tab{border:0;border-radius:18px;padding:10px 16px;font-weight:1000;background:#e8f1ff}.tab.on{background:#ffd95e}.gamebox{max-width:980px;margin:auto;text-align:center}.prompt{font-weight:1000;font-size:clamp(28px,4vw,52px);margin:8px}.choicegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.choicegrid img{width:100%;height:34vh;object-fit:contain}.bigCard{max-height:58vh;max-width:min(70vw,520px);object-fit:contain;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.18)}.answers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}.answer{border:0;border-radius:20px;padding:14px 22px;font-size:clamp(20px,2.4 nd:#fff0a7}.shuffleBtn{background:linear-gradient(180deg,#b8f49d,#76dd65);box-shadow:0 5px 0 #3fae36;padding-left:22px;padding-right:22px}.shuffleBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #3fae36}@media(max-width:900px){.grid6{grid-template-columns:repeat(2,1fr)}.choicegrid{grid-template-columns:repeat(2,1fr)}.memory,.memory.level3{grid-template-columns:repeat(3,minmax(120px,180px));max-width:620px;gap:12px}.flash img{height:27vh}.title{font-size:22px}}@media(max-width:560px){.memory,.memory.level3{grid-template-columns:repeat(3,minmax(95px,1fr));gap:10px}}
</style></head><body>
<div id="home" class="screen active homeMenu"><button id="h1" class="hotspot" onclick="openStage('feel')" aria-label="Feelings"></button><button id="h2" class="hotspot" onclick="openStage('weather')" aria-label="Weather"></button><button id="h3" class="hotspot" onclick="openStage('mix')" aria-label="Mix Together"></button><button id="h4" class="hotspot" onclick="openStage('speak')" aria-label="Speaking Challenge"></button><button id="h5" class="hotspot" onclick="openStage('memory')" aria-label="Memory Game"></button></div>

<div id="speak" class="screen" data-bg="assets/sunny_schoolyard_playground_scene.webp"><div class="shade"></div><div class="top"><div class="title">4 — Speaking Challenge</div><div class="spacer"></div><button class="navbtn" onclick="goHome()">🏠 Home</button></div><div class="content"><div class="levelBtns"><button class="level" onclick="setSpeakLevel(1)">Level 1 — Choices</button><button class="level" onclick="setSpeakLevel(2)">Level 2 — Question</button><button class="level" onclick="setSpeakLevel(3)">Level 3 — Picture Only</button></div><div class="panel gamebox" id="speakBody" style="margin-top:12px"></div></div></div>

<script>
const AUDIO={"word_happy":"assets/audio/word_happy.wav","word_good":"assets/audio/word_good.wav","word_okay":"assets/audio/word_okay.wav","word_tired":"assets/audio/word_tired.wav","word_sad":"assets/audio/word_sad.wav","word_fine":"assets/audio/word_fine.wav","word_sunny":"assets/audio/word_sunny.wav","word_rainy":"assets/audio/word_rainy.wav","word_cloudy":"assets/audio/word_cloudy.wav","word_windy":"assets/audio/word_windy.wav","word_hot":"assets/audio/word_hot.wav","word_cold":"assets/audio/word_cold.wav","sent_happy":"assets/audio/sent_happy.wav","sent_good":"assets/audio/sent_good.wav","sent_okay":"assets/audio/sent_okay.wav","sent_tired":"assets/audio/sent_tired.wav","sent_sad":"assets/audio/sent_sad.wav","sent_fine":"assets/audio/sent_fine.wav","sent_sunny":"assets/audio/sent_sunny.wav","sent_rainy":"assets/audio/sent_rainy.wav","sent_cloudy":"assets/audio/sent_cloudy.wav","sent_windy":"assets/audio/sent_windy.wav","sent_hot":"assets/audio/sent_hot.wav","sent_cold":"assets/audio/sent_cold.wav","q_feeling":"assets/audio/q_feeling.wav","q_weather":"assets/audio/q_weather.wav","try_again":"assets/audio/try_again.wav","say_it":"assets/audio/say_it.wav","find_happy":"assets/audio/find_happy.wav","find_good":"assets/audio/find_good.wav","find_okay":"assets/audio/find_okay.wav","find_tired":"assets/audio/find_tired.wav","find_sad":"assets/audio/find_sad.wav","find_fine":"assets/audio/find_fine.wav","find_sunny":"assets/audio/find_sunny.wav","find_rainy":"assets/audio/find_rainy.wav","find_cloudy":"assets/audio/find_cloudy.wav","find_windy":"assets/audio/find_windy.wav","find_hot":"assets/audio/find_hot.wav","find_cold":"assets/audio/find_cold.wav"};
const VOICES={};let currentVoice=null;
const AUDIO_LOAD_QUEUE=[];let audioLoadsActive=0;const AUDIO_MAX_CONCURRENT=4;

function ensureVoice(k,priority=false){
  if(VOICES[k])return VOICES[k];
  const src=AUDIO[k];
  if(!src)return null;
  const a=new Audio();
  a.preload='auto';
  a.src=src;
  VOICES[k]=a;
  const task=()=>{try{a.load()}catch(e){}};
  if(priority)AUDIO_LOAD_QUEUE.unshift(task);else AUDIO_LOAD_QUEUE.push(task);
  pumpAudioQueue();
  return a;
}

function pumpAudioQueue(){
  while(audioLoadsActive<AUDIO_MAX_CONCURRENT&&AUDIO_LOAD_QUEUE.length){
    const task=AUDIO_LOAD_QUEUE.shift();
    audioLoadsActive++;
    try{task()}catch(e){}
    setTimeout(()=>{audioLoadsActive=Math.max(0,audioLoadsActive-1);pumpAudioQueue()},180);
  }
}

function preloadCoreVoices(){
  [
    'q_feeling','q_weather','try_again','say_it',
    'word_happy','word_good','word_okay','word_tired','word_sad','word_fine',
    'word_sunny','word_rainy','word_cloudy','word_windy','word_hot','word_cold'
  ].forEach(k=>ensureVoice(k,true));
}

function preloadRemainingVoices(){
  Object.keys(AUDIO).forEach(k=>ensureVoice(k,false));
}

function preloadVoices(){
  preloadCoreVoices();
  const later=()=>preloadRemainingVoices();
  if('requestIdleCallback'in window)requestIdleCallback(later,{timeout:2500});
  else setTimeout(later,1200);
}

function playVoiceKey(k){
  const a=ensureVoice(k,true);
  if(!a)return;
  if(currentVoice&&currentVoice!==a){
    try{currentVoice.pause();currentVoice.currentTime=0}catch(e){}
  }
  currentVoice=a;
  try{a.currentTime=0}catch(e){}
  const pr=a.play();
  if(pr&&pr.catch){
    pr.catch(()=>{
      try{a.load()}catch(e){}
      const retry=a.play();
      if(retry&&retry.catch)retry.catch(()=>{});
    });
  }
}
function audioKeyForText(t){const x=t.trim().toLowerCase().replace(/[.!?]/g,'');const m={"how are you today":"q_feeling","how's the weather":"q_weather","try again":"try_again","say it":"say_it"};if(m[x])return m[x];if(x.startsWith('find '))return 'find_'+x.slice(5).trim().replace(/\s+/g,'_');if(x.startsWith("i'm "))return 'sent_'+x.slice(4).trim().replace(/\s+/g,'_');if(x.startsWith("it's "))return 'sent_'+x.slice(5).trim().replace(/\s+/g,'_');if(AUDIO['word_'+x])return 'word_'+x;return null}
preloadVoices();
document.addEventListener('pointerdown',()=>preloadRemainingVoices(),{once:true,passive:true});
const DATA=[{"word": "happy", "cat": "feeling", "pw": "assets/happy_playground_jump.webp", "pic": "assets/joyful_playground_leap.webp", "wordImg": "assets/glossy_happy_flashcard_with_pink_waves.webp", "sentImg": "assets/i_m_happy_pastel_flashcard.webp", "sentence": "I'm happy.", "question": "How are you today?"}, {"word": "good", "cat": "feeling", "pw": "assets/good_schoolday_thumbs_up.webp", "pic": "assets/confident_schoolboy_thumbs_up.webp", "wordImg": "assets/glossy_good_flashcard_with_pink_waves.webp", "sentImg": "assets/i_m_good_positivity_flashcard.webp", "sentence": "I'm good.", "question": "How are you today?"}, {"word": "okay", "cat": "feeling", "pw": "assets/okay_playground_flashcard.webp", "pic": "assets/cheerful_boy_making_an_ok_gesture.webp", "wordImg": "assets/glossy_golden_okay_card.webp", "sentImg": "assets/i_m_okay_flashcard_poster.webp", "sentence": "I'm okay.", "question": "How are you today?"}, {"word": "tired", "cat": "feeling", "pw": "assets/tired_girl_school_flashcard.webp", "pic": "assets/sleepy_schoolyard_yawn.webp", "wordImg": "assets/glossy_golden_tired_word_card.webp", "sentImg": "assets/i_m_tired_esl_flashcard.webp", "sentence": "I'm tired.", "question": "How are you today?"}, {"word": "sad", "cat": "feeling", "pw": "assets/sad_playground_flashcard.webp", "pic": "assets/sad_girl_alone_on_the_playground_bench.webp", "wordImg": "assets/glossy_gold_frame_sad_flashcard.webp", "sentImg": "assets/i_m_sad_emotion_flashcard.webp", "sentence": "I'm sad.", "question": "How are you today?"}, {"word": "fine", "cat": "feeling", "pw": "assets/cheerful_playground_fine_flashcard.webp", "pic": "assets/fine_at_the_playground.webp", "wordImg": "assets/glossy_fine_flashcard_with_pink_waves.webp", "sentImg": "assets/playful_golden_i_m_fine_flashcard.webp", "sentence": "I'm fine.", "question": "How are you today?"}, {"word": "sunny", "cat": "weather", "pw": "assets/sunny_playground_smiles.webp", "pic": "assets/joyful_boy_jumping_in_the_schoolyard.webp", "wordImg": "assets/sunny_flashcard_with_glossy_golden_frame.webp", "sentImg": "assets/glossy_golden_frame_flashcard_it_s_sunny.webp", "sentence": "It's sunny.", "question": "How's the weather?"}, {"word": "rainy", "cat": "weather", "pw": "assets/rainy_day_adventure.webp", "pic": "assets/joyful_rainy_day_puddle_splash.webp", "wordImg": "assets/rainy_day_flashcard.webp", "sentImg": "assets/glossy_pink_rainy_day_flashcard.webp", "sentence": "It's rainy.", "question": "How's the weather?"}, {"word": "cloudy", "cat": "weather", "pw": "assets/cloudy_day_flashcard.webp", "pic": "assets/dreaming_beneath_cloudy_skies.webp", "wordImg": "assets/cloudy_sky_flashcard.webp", "sentImg": "assets/it_s_cloudy_flashcard.webp", "sentence": "It's cloudy.", "question": "How's the weather?"}, {"word": "windy", "cat": "weather", "pw": "assets/windy_autumn_twirl_flashcard.webp", "pic": "assets/joyful_windy_day_in_the_park.webp", "wordImg": "assets/glossy_3d_windy_flashcard.webp", "sentImg": "assets/glossy_flashcard_it_s_windy.webp", "sentence": "It's windy.", "question": "How's the weather?"}, {"word": "hot", "cat": "weather", "pw": "assets/hot_summer_flashcard.webp", "pic": "assets/summer_heat_at_the_playground.webp", "wordImg": "assets/glossy_hot_weather_flashcard.webp", "sentImg": "assets/glossy_it_s_hot_educational_flashcard.webp", "sentence": "It's hot.", "question": "How's the weather?"}, {"word": "cold", "cat": "weather", "pw": "assets/winter_cold_flashcard.webp", "pic": "assets/shivering_boy_in_a_snowy_winter_scene.webp", "wordImg": "assets/icy_blue_cold_flashcard.webp", "sentImg": "assets/glossy_red_it_s_cold_flashcard.webp", "sentence": "It's cold.", "question": "How's the weather?"}];
let currentPair=null, pendingPair=null, memLock=false, pairs=0, speakLevel=1, speakItem=null, mixItem=null;
let _audioCtx=null;function getAudioCtx(){if(!_audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)_audioCtx=new A()}if(_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume();return _audioCtx}
function beep(ok=true){const c=getAudioCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:220;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}
function say(t){const k=audioKeyForText(t);if(k){playVoiceKey(k);return}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const target=document.getElementById(id);
  if(target?.dataset?.bg&&!target.dataset.bgLoaded){
    target.style.backgroundImage=`url('${target.dataset.bg}')`;
    target.dataset.bgLoaded='1';
  }
  target.classList.add('active');
}
function goHome(){show('home')}
function openStage(id){show(id); if(id==='feel') feelMode('learn'); if(id==='weather')weatherMode('learn'); if(id==='mix')newMix(); if(id==='speak')setSpeakLevel(1); if(id==='memory')startMemory(1)}
function setTab(btn){if(!btn)return;btn.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));btn.classList.add('on')}
function catItems(cat){return DATA.filter(x=>x.cat===cat)}
function learnGrid(cat){return '<div class="grid6">'+catItems(cat).map(x=>`<button class="flash" onclick="say('${x.word}')"><img decoding="async" loading="lazy" src="${x.pw}"></button>`).join('')+'</div>'}
function feelMode(m,b){setTab(b);const el=document.getElementById('feelBody');if(m==='learn')el.innerHTML=learnGrid('feeling');else if(m==='find')renderFind('feeling',el);else renderSentence('feeling',el)}
function weatherMode(m,b){setTab(b);const el=document.getElementById('weatherBody');if(m==='learn')el.innerHTML=learnGrid('weather');else if(m==='find')renderFind('weather',el);else renderSentence('weather',el)}
function sample(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}
function renderFind(cat,el){const all=catItems(cat), target=all[Math.floor(Math.random()*all.length)], choices=sample(all.filter(x=>x!==target),3).concat(target).sort(()=>Math.random()-.5);el.innerHTML=`<div class="panel gamebox"><div class="prompt">🔊 Find <b>${target.word}</b></div><button class="navbtn" onclick="say('Find ${target.word}')">Hear again</button><div class="choicegrid" style="margin-top:12px">${choices.map(x=>`<button class="flash" onclick="checkFind('${x.word}','${target.word}','${cat}')"><img decoding="async" loading="lazy" src="${x.pic}"></button>`).join('')}</div></div>`;say('Find '+target.word)}
function checkFind(g,t,cat){if(g===t){beep(true);say(t);setTimeout(()=>renderFind(cat,document.getElementById(cat==='feeling'?'feelBody':'weatherBody')),650)}else{beep(false);say('Try again')}}
function renderSentence(cat,el){const all=catItems(cat),q=cat==='feeling'?'How are you today?':"How's the weather?";el.innerHTML=`<div class="panel gamebox"><div class="prompt">${q}</div><button class="navbtn" data-say="${q}" onclick="say(this.dataset.say)">🔊 Hear question</button><div class="grid6" style="margin-top:12px">${all.map(x=>`<button class="flash" data-say="${x.sentence}" onclick="say(this.dataset.say)"><img decoding="async" loading="lazy" src="${x.sentImg}"></button>`).join('')}</div></div>`}
function newMix(){mixItem=DATA[Math.floor(Math.random()*DATA.length)];document.getElementById('mixBody').innerHTML=`<div class="prompt">Feeling or Weather?</div><img decoding="async" loading="lazy" class="bigCard" src="${mixItem.pic}"><div class="answers"><button class="answer" onclick="mixChoose('feeling')">😊 Feeling</button><button class="answer" onclick="mixChoose('weather')">🌦️ Weather</button></div>`}
function mixChoose(c){if(c!==mixItem.cat){beep(false);say('Try again');return}beep(true);const q=mixItem.question;document.getElementById('mixBody').innerHTML=`<div class="prompt">${q}</div><img decoding="async" loading="lazy" class="bigCard" src="${mixItem.pic}"><div class="answers"><button class="answer" onclick="mixAnswer(true)">${mixItem.sentence}</button><button class="answer" onclick="mixAnswer(false)">${mixItem.cat==='feeling'?"It's ":"I'm "+mixItem.word+'.'}</button></div>`;say(q)}
function mixAnswer(ok){if(ok){beep(true);say(mixItem.sentence);setTimeout(newMix,1100)}else{beep(false);say('Try again')}}
function setSpeakLevel(l){speakLevel=l;newSpeak()}
function newSpeak(){speakItem=DATA[Math.floor(Math.random()*DATA.length)];let extra='';if(speakLevel===1){const wrong=DATA.filter(x=>x.cat!==speakItem.cat)[Math.floor(Math.random()*6)];extra=`<div class="answers"><button class="answer" onclick="teacherSpeak(true)">${speakItem.sentence}</button><button class="answer" onclick="teacherSpeak(false)">${wrong.sentence}</button></div>`}else if(speakLevel===2){extra=`<div class="prompt">${speakItem.question}</div><div class="answers"><button class="answer good" onclick="teacherSpeak(true)">✓ Student said it</button><button class="answer" data-say="${speakItem.question}" onclick="say(this.dataset.say)">🔊 Question</button></div>`}else{extra=`<div class="prompt">🎤 Say the full sentence.</div><div class="answers"><button class="answer good" onclick="teacherSpeak(true)">✓ Correct</button><button class="answer" data-say="${speakItem.sentence}" onclick="say(this.dataset.say)">🔊 Hear answer</button></div>`}document.getElementById('speakBody').innerHTML=`<img decoding="async" loading="lazy" class="bigCard" src="${speakItem.pic}">${extra}`;if(speakLevel===2)say(speakItem.question)}
function teacherSpeak(ok){if(ok){beep(true);say(speakItem.sentence);setTimeout(newSpeak,900)}else{beep(false);say('Try again')}}
function replayMemory(){const level=window._memLevel||1; playUi('flip'); startMemory(level)}
function startMemory(level){pairs=0;document.getElementById('score').textContent='Pairs: 0';const selected=sample(DATA, level===3?8:6);window._memSelected=selected;window._memLevel=level;let cards=[];selected.forEach((x,i)=>{cards.push({key:i,item:x,type:'pic'});cards.push({key:i,item:x,type:level===1?'word':(level===2?'sent':(Math.random()<.5?'word':'sent'))})});cards.sort(()=>Math.random()-.5);const b=document.getElementById('memoryBoard');b.classList.toggle('level3',level===3);b.innerHTML=cards.map((c,i)=>`<div class="mcard" data-key="${c.key}" data-i="${i}" onclick="flipMem(this)"><div class="inner"><div class="face back"><img decoding="async" loading="lazy" src="assets/memory_card_back_portrait.webp" alt="card back"></div><div class="face front"><img decoding="async" loading="lazy" src="${c.type==='pic'?c.item.pic:(c.type==='word'?c.item.wordImg:c.item.sentImg)}"></div></div></div>`).join('');currentPair=null;pendingPair=null;window._pendingItem=null;memLock=false}
function flipMem(el){if(memLock||el.classList.contains('flipped')||el.classList.contains('matched'))return;el.classList.add('flipped');beep(true);if(!currentPair){currentPair=el;return}memLock=true;const a=currentPair,b=el;if(a.dataset.key===b.dataset.key){const idx=Number(a.dataset.key);const target=(window._memSelected||[])[idx];pendingPair=[a,b];window._pendingItem=target||null;document.getElementById('sayImg').src=target?target.pic:'';document.getElementById('sayQuestion').textContent=target?target.question:'Say the word or full sentence aloud.';document.getElementById('sayOverlay').classList.add('show');if(target)setTimeout(()=>say(target.question),120);currentPair=null;memLock=false}else{setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');currentPair=null;memLock=false;beep(false)},700)}}
function getWordFromCard(a,b){return ''}
function confirmPair(ok){if(!pendingPair)return;if(ok){pendingPair.forEach(x=>x.classList.add('matched'));pairs++;document.getElementById('score').textContent='Pairs: '+pairs;beep(true);if(window._pendingItem)say(window._pendingItem.sentence)}else{pendingPair.forEach(x=>x.classList.remove('flipped'));beep(false);say('Try again')}pendingPair=null;window._pendingItem=null;document.getElementById('sayOverlay').classList.remove('show')}
function speakCurrentSentence(){if(window._pendingItem)say(window._pendingItem.sentence);else say('Say it')}
