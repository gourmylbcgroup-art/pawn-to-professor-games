let ptpVoice=null,ptpLastSpeech='',ptpLastAt=0;
function ptpInitSpeech(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();ptpVoice=vs.find(v=>/^en(-|_)/i.test(v.lang)&&v.localService)||vs.find(v=>/^en(-|_)/i.test(v.lang))||null;}
if('speechSynthesis' in window){ptpInitSpeech();speechSynthesis.addEventListener?.('voiceschanged',ptpInitSpeech);document.addEventListener('pointerdown',()=>{ptpInitSpeech();if(speechSynthesis.paused)speechSynthesis.resume()},{once:true,passive:true});}
// One voice controller for all lesson layers: never allow simultaneous speech.
let ptpSpeechSerial=0, ptpSpeechPending=null, ptpSpeechTimer=0;
function stopLessonSpeech(){ptpSpeechSerial++;clearTimeout(ptpSpeechTimer);ptpSpeechPending=null;try{speechSynthesis.cancel()}catch(e){}}
function say(t){
 if(!soundOn||!('speechSynthesis' in window)||!t)return;
 t=String(t).trim();if(!t)return;
 const now=performance.now();
 if(t===ptpLastSpeech&&now-ptpLastAt<350)return;
 ptpLastSpeech=t;ptpLastAt=now;
 const serial=++ptpSpeechSerial;
 clearTimeout(ptpSpeechTimer);
 // Do not let older queued announcements play over the latest instruction.
 try{speechSynthesis.cancel()}catch(e){}
 ptpSpeechTimer=setTimeout(()=>{
  if(serial!==ptpSpeechSerial||!soundOn||document.hidden)return;
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;u.pitch=1.02;
  if(ptpVoice)u.voice=ptpVoice;
  u.onstart=()=>{if(musicCtx&&musicGain)musicGain.gain.setTargetAtTime(.27,musicCtx.currentTime,.06)};
  const restore=()=>{if(musicCtx&&musicGain)musicGain.gain.setTargetAtTime(1,musicCtx.currentTime,.12)};
  u.onend=restore;u.onerror=restore;
  try{speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){restore()}
 },65);
}

function level1Learn(reset){if(reset){learnIndex=0;wordRevealed=false}const c=LEARN_CARDS[learnIndex];shell('Learn','learn',`<div class="learnWrap"><div class="bigCard"><img class="protect" decoding="async" src="${c.file}"></div><div class="learnSide"><div class="counter">${learnIndex+1} / ${LEARN_CARDS.length}</div><h3>Learn one card at a time</h3><div class="wordReveal">${wordRevealed?c.label:'••••••'}</div><div class="gesture">Gesture: ${gestures[c.id]||'Look, listen, repeat.'}</div><div class="toolbar"><button onclick="say('${jsq(c.label)}')">🔊 Hear</button><button class="purple" onclick="revealLearn()">👁 Reveal Word</button></div><div class="navRow"><button class="action grey" onclick="learnPrev()">◀ Back</button><button class="action green" onclick="learnNext()">Next ▶</button></div></div></div>`)}

function newListenQuestion(){const target=LEARN_CARDS[Math.floor(Math.random()*LEARN_CARDS.length)];let pool=LEARN_CARDS.filter(x=>x.id!==target.id).sort(()=>Math.random()-.5).slice(0,3).concat(target).sort(()=>Math.random()-.5);listenQuestion={target,pool};}
function level1Listen(reset){if(reset){listenRound=0;newListenQuestion()}const q=listenQuestion;shell('Listen','listen',`<div class="listenWrap"><div class="promptBar"><button class="action" onclick="say('${jsq(q.target.label)}')">🔊 LISTEN</button><div class="promptText">Tap the flashcard you hear · Round ${listenRound+1}/6</div></div><div class="fourGrid">${q.pool.map(c=>`<button class="listenCard" id="lc_${safeid(c.id)}" onclick="checkListen('${jsq(c.id)}',this)"><img class="protect" decoding="async" src="${c.file}"></button>`).join('')}</div></div>`);setTimeout(()=>say(q.target.label),250)}
function checkListen(id,el){if(id===listenQuestion.target.id){el.classList.add('good');say(listenQuestion.target.label);listenRound++;if(listenRound>=6){toast('LISTEN complete!');setTimeout(()=>openStage('play'),650)}else{setTimeout(()=>{newListenQuestion();level1Listen(false)},650)}}else{el.classList.add('bad');say('Try again');setTimeout(()=>el.classList.remove('bad'),500)}}
function level1Play(reset){if(reset){playIndex=0;playDone=[]}const def=PLAY_CARDS[playIndex];if(!def){toast('PLAY complete!');return openStage('practice')}const c=ALL_CARDS.find(x=>x.id===def.id);shell('Play','play',`<div class="playWrap"><div class="dropZone" data-cat="New Year"><h3>🎆 NEW YEAR</h3><div class="dropped">${playDone.filter(x=>x.category==='New Year').map(x=>`<img src="${x.file}">`).join('')}</div></div><div class="dragStage"><div style="font-weight:900;margin-bottom:9px">Slide the flashcard to the right window.</div><img id="dragCard" class="dragCard protect" src="${c.file}" data-id="${def.id}" data-cat="${def.category}"><div style="font-weight:900;margin-top:8px">${playIndex+1} / ${PLAY_CARDS.length}</div></div><div class="dropZone" data-cat="Lunar New Year"><h3>🧧 LUNAR NEW YEAR</h3><div class="dropped">${playDone.filter(x=>x.category==='Lunar New Year').map(x=>`<img src="${x.file}">`).join('')}</div></div></div>`);setTimeout(enableDrag,0)}
function enableDrag(){const el=document.getElementById('dragCard');if(!el)return;let dragging=false;el.addEventListener('pointerdown',e=>{dragging=true;el.setPointerCapture(e.pointerId);el.classList.add('dragging');move(e)});el.addEventListener('pointermove',e=>{if(dragging)move(e)});el.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;el.classList.remove('dragging');el.style.left='';el.style.top='';el.releasePointerCapture?.(e.pointerId);const under=document.elementFromPoint(e.clientX,e.clientY);const zone=under?.closest?.('.dropZone');const correct=el.dataset.cat;if(zone&&zone.dataset.cat===correct){const card=ALL_CARDS.find(x=>x.id===el.dataset.id);playDone.push({id:card.id,file:card.file,category:correct});say('Correct');playIndex++;setTimeout(()=>level1Play(false),280)}else{say('Try again');toast('Try again — slide it to the correct window.')}});function move(e){el.style.left=e.clientX+'px';el.style.top=e.clientY+'px'}}
function level1Practice(reset){if(reset)practiceRound=0;const happy=ALL_CARDS.find(x=>x.id==='04_HAPPY'), lucky=ALL_CARDS.find(x=>x.id==='06_LUCKY');const instructions=['Model: listen and repeat.','Choose the correct word.','Picture only: say the whole sentence.'][practiceRound];shell('Practice','practice',`<div class="practiceWrap"><div class="sentence">I am ______. · ${instructions}</div><button class="practiceCard" onclick="practicePick('happy')"><img class="protect" decoding="async" src="${happy.file}"><div class="lbl">${practiceRound<2?'happy':''}</div></button><button class="practiceCard" onclick="practicePick('lucky')"><img class="protect" decoding="async" src="${lucky.file}"><div class="lbl">${practiceRound<2?'lucky':''}</div></button></div>`);if(practiceRound===0)setTimeout(()=>say('I am happy. I am lucky.'),250)}
function practicePick(word){say('I am '+word+'.');toast('I am '+word+'.');if(practiceRound<2){practiceRound++;setTimeout(()=>level1Practice(false),650)}else{setTimeout(()=>openStage('finish'),650)}}
function level1Finish(reset){if(reset)finishStep=0;const steps=['LISTEN','NAME','SORT','SENTENCE'];const progress=`<div class="finishProgress">${steps.map((s,i)=>`<span class="${i<finishStep?'done':''}">${s}</span>`).join('')}</div>`;let body='';if(finishStep===0){const target=LEARN_CARDS[6];const opts=[LEARN_CARDS[1],LEARN_CARDS[2],LEARN_CARDS[6],LEARN_CARDS[7]];body=`${progress}<div class="challenge"><h3>1. Listen and find it</h3><button class="action" onclick="say('fireworks')">🔊 Listen</button><div class="finishFour">${opts.map(c=>`<button onclick="finishListen('${jsq(c.id)}')"><img src="${c.file}"></button>`).join('')}</div></div>`;setTimeout(()=>say('fireworks'),250)}else if(finishStep===1){const c=LEARN_CARDS[1];body=`${progress}<div class="challenge"><h3>2. What is it?</h3><img src="${c.file}"><div class="toolbar"><button onclick="say('family')">🔊 Reveal: FAMILY</button><button class="green" onclick="finishNext()">I said it ✓</button></div></div>`}else if(finishStep===2){const c=ALL_CARDS.find(x=>x.id==='08_RED_ENVELOPE');body=`${progress}<div class="challenge"><h3>3. Sort it</h3><img src="${c.file}"><div class="toolbar"><button onclick="finishSort('New Year')">NEW YEAR</button><button class="green" onclick="finishSort('Lunar New Year')">LUNAR NEW YEAR</button></div></div>`}else if(finishStep===3){body=`${progress}<div class="challenge"><h3>4. Finish the sentence</h3><div style="font-size:42px;font-weight:950">I am ______.</div><div class="toolbar"><button onclick="finishSentence('happy')">😊 HAPPY</button><button class="green" onclick="finishSentence('lucky')">🍀 LUCKY</button></div></div>`}else{body=`${progress}<div class="challenge"><div style="font-size:64px">🏆</div><h3 style="font-size:40px">LEVEL 1 COMPLETE!</h3><div style="font-size:22px">You learned, listened, sorted, and built the sentence.</div><div class="toolbar"><button class="green" onclick="openStage('game')">Go to GAME ▶</button></div></div>`}shell('Finish','finish',`<div class="finishWrap">${body}</div>`)}
function finishListen(id){if(id==='07_FIREWORKS'){say('Correct. Fireworks.');finishNext()}else say('Try again')}function finishSort(cat){if(cat==='Lunar New Year'){say('Correct');finishNext()}else say('Try again')}function finishSentence(w){say('I am '+w+'.');finishNext()}function finishNext(){finishStep++;setTimeout(()=>level1Finish(false),280)}
function level1Game(){shell('Game','game',`<div class="gameStage"><div class="visual"><img src="assets/w1_game.webp"></div><div class="info"><h3>Spot & Say · Level 1</h3><ol><li>Find 3 differences.</li><li>Say the word for each difference.</li><li>Use only words learned in Level 1.</li></ol><div class="toolbar"><button onclick="say('Find three differences. Say the word.')">🔊 Instructions</button></div></div></div>`)}
function genericStage(level,s){if(s==='speak'&&level!=='3')return openStage('speak');const info=GENERIC[level];const rec=info.stages[s];if(!rec){toast('This section is not available in LEVEL '+level);return}const [title,img,steps,audio]=rec;shell(title,s,`<div class="lessonCard"><div class="visual"><img src="assets/${img}"></div><div class="info"><h3>${title}</h3><ol>${steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="toolbar"><button onclick="say('${jsq(audio)}')">🔊 Audio</button>${s==='finish'?'<button class="green" onclick="openStage(\'game\')">Next: GAME ▶</button>':''}</div></div></div>`)}
function openPresentation(){if(!requireLevel())return;const stages=['start','learn','listen','play','practice','speak','finish','game'];const thumbs=stages.map(s=>`<button class="libCard" style="cursor:pointer" onclick="openStage('${s}')"><div style="font-size:18px;font-weight:950;padding:18px">${s.toUpperCase()}${(s==='speak'&&currentLevel!=='3')?' 🔒':''}</div></button>`).join('');panel.innerHTML=`<button class="close" onclick="closeModal()">✕ Close</button><div class="head"><h2>LEVEL ${currentLevel} · Presentation Map</h2></div><div class="gridLibrary">${thumbs}</div>`;modal.classList.add('show')}
function openLevelMenu(){panel.innerHTML=`<button class="close" onclick="closeModal()">✕ Close</button><div class="head"><h2>Choose a Level</h2></div><div class="menuGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;align-items:center">${['1','2','3'].map(n=>`<button class="lessonCard" style="display:block;padding:30px;border:0;cursor:pointer" onclick="selectLevel('${n}');closeModal()"><h3>LEVEL ${n}</h3><p>${n==='1'?'Discover vocabulary, listen, sort, and use I am…':n==='2'?'Remember, classify, and build I wish you…':'Speak and perform independently.'}</p></button>`).join('')}</div>`;modal.classList.add('show')}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}function safeid(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_')}
// ---- Personalized flashcard viewer + organizer ----
function openFlashcards(tab='viewer'){panel.className='panel fcPanel';panel.innerHTML=`<button class="close" onclick="closeFlashcards()">✕ Close</button><div class="head"><h2>Personalized Flashcards</h2><span class="pill" id="setCount">${selectedOrder.length} / 40 selected</span></div><div class="fcTabs"><button id="tab_viewer" onclick="renderFCTab('viewer')">Viewer</button><button id="tab_organizer" onclick="renderFCTab('organizer')">Organizer</button><button id="tab_saved" onclick="renderFCTab('saved')">My Saved Sets</button></div><div class="fcBody" id="fcBody"></div>`;modal.classList.add('show');renderFCTab(tab)}
function closeFlashcards(){panel.className='panel';closeModal()}
function renderFCTab(tab){['viewer','organizer','saved'].forEach(t=>document.getElementById('tab_'+t)?.classList.toggle('on',t===tab));if(tab==='viewer')renderViewer();if(tab==='organizer')renderOrganizer();if(tab==='saved')renderSavedSets()}
function visibleSelected(){return selectedOrder.filter(id=>!hiddenIds.has(id)).map(id=>ALL_CARDS.find(c=>c.id===id)).filter(Boolean)}
function viewerCards(){return viewerMode==='all'?ALL_CARDS:visibleSelected()}
function renderViewer(){const arr=viewerCards();if(viewerIndex>=arr.length)viewerIndex=0;const c=arr[viewerIndex];document.getElementById('fcBody').innerHTML=arr.length?`<div class="fcViewer"><div class="viewerStage"><img class="protect" decoding="async" src="${c.file}"></div><div class="viewerSide"><div class="viewerTitle">${c.label}</div><div class="viewerCount">${viewerIndex+1} / ${arr.length}</div><div class="viewerMode"><button class="${viewerMode==='all'?'on':''}" onclick="viewerMode='all';viewerIndex=0;renderViewer()">All ${ALL_CARDS.length}</button><button class="${viewerMode==='set'?'on':''}" onclick="viewerMode='set';viewerIndex=0;renderViewer()">Current Set</button></div><div class="toolbar"><button onclick="viewerPrev()">◀ Back</button><button class="green" onclick="say('${jsq(c.label)}')">🔊 Audio</button><button onclick="viewerNext()">Next ▶</button></div><div style="margin-top:12px;font-size:14px">Current set: <b>${currentSetName}</b><br>${selectedOrder.length} selected · ${hiddenIds.size} hidden</div><div class="toolbar"><button class="purple" onclick="renderFCTab('organizer')">⚙ Organizer</button><button class="orange" onclick="saveCurrentSet()">💾 Save Set</button></div></div></div>`:`<div class="empty">No visible cards in the current set. Open Organizer to select cards.</div>`}
function viewerPrev(){const a=viewerCards();if(!a.length)return;viewerIndex=(viewerIndex-1+a.length)%a.length;renderViewer()}function viewerNext(){const a=viewerCards();if(!a.length)return;viewerIndex=(viewerIndex+1)%a.length;renderViewer()}
function renderOrganizer(){document.getElementById('setCount').textContent=selectedOrder.length+' / 40 selected';document.getElementById('fcBody').innerHTML=`<div class="setBar"><b>${currentSetName}</b><span>${selectedOrder.length} / 40</span><button class="action green" onclick="saveCurrentSet()">Save Set</button><button class="action purple" onclick="renderFCTab('saved')">My Saved Sets</button></div><div class="gridLibrary">${ALL_CARDS.map(c=>{const sel=selectedOrder.includes(c.id),hid=hiddenIds.has(c.id);return `<div class="libCard ${sel?'selectedMark':''} ${hid?'hiddenCard':''}"><img class="protect" decoding="async" src="${c.file}"><div class="name" title="${c.label}">${c.label}</div><div class="libActions"><button onclick="toggleSelect('${jsq(c.id)}')">${sel?'✓ Selected':'+ Select'}</button><button onclick="toggleHide('${jsq(c.id)}')">${hid?'Show':'Hide'}</button></div>${sel?`<div class="libActions"><button onclick="moveCard('${jsq(c.id)}',-1)">↑</button><button onclick="moveCard('${jsq(c.id)}',1)">↓</button></div>`:''}</div>`}).join('')}</div>`}
function toggleSelect(id){const i=selectedOrder.indexOf(id);if(i>=0){selectedOrder.splice(i,1);hiddenIds.delete(id)}else{if(selectedOrder.length>=40){alert('A saved set can contain a maximum of 40 flashcards.');return}selectedOrder.push(id)}renderOrganizer()}
function toggleHide(id){if(!selectedOrder.includes(id)){if(selectedOrder.length>=40){alert('A saved set can contain a maximum of 40 flashcards.');return}selectedOrder.push(id)}if(hiddenIds.has(id))hiddenIds.delete(id);else hiddenIds.add(id);renderOrganizer()}
function moveCard(id,dir){const i=selectedOrder.indexOf(id);const j=i+dir;if(i<0||j<0||j>=selectedOrder.length)return;[selectedOrder[i],selectedOrder[j]]=[selectedOrder[j],selectedOrder[i]];renderOrganizer()}
function storageApi(){return window.PTPFlashcardStorage&&typeof window.PTPFlashcardStorage.listSets==='function'?window.PTPFlashcardStorage:null}
function fallbackKey(){return 'ptp_fc_'+window.PTP_FLASHCARD_CONFIG.unitKey+'_'+window.PTP_FLASHCARD_CONFIG.lessonKey}
async function listSets(){const api=storageApi();if(api){try{return await api.listSets()}catch(e){console.warn(e)}}return JSON.parse(localStorage.getItem(fallbackKey())||'[]')}
async function saveSetObj(obj){const api=storageApi();if(api){return await api.saveSet(obj)}let sets=await listSets();const i=sets.findIndex(x=>x.id===obj.id);if(i>=0)sets[i]=obj;else sets.push(obj);localStorage.setItem(fallbackKey(),JSON.stringify(sets));return obj}
async function deleteSetObj(id){const api=storageApi();if(api)return await api.deleteSet(id);let sets=(await listSets()).filter(x=>x.id!==id);localStorage.setItem(fallbackKey(),JSON.stringify(sets))}
async function saveCurrentSet(){if(selectedOrder.length>40){alert('A saved set can contain a maximum of 40 flashcards.');return}const sets=await listSets();if(!currentSetId&&sets.length>=3){alert('You already have 3 saved sets for this lesson.\nDelete one before saving another.');return}let name=currentSetName;if(!currentSetId||name==='Current Set'){name=prompt('Set name:','My Review Set')||'';if(!name.trim())return}const id=currentSetId||('g3u5_'+Date.now());const obj={id,setName:name.trim(),cardIds:[...selectedOrder],hiddenCardIds:[...hiddenIds],metadata:{order:[...selectedOrder]}};await saveSetObj(obj);currentSetId=id;currentSetName=obj.setName;toast('Flashcard set saved');renderFCTab('organizer')}
async function renderSavedSets(){const sets=await listSets();document.getElementById('fcBody').innerHTML=sets.length?`<div class="savedList">${sets.map(s=>`<div class="savedItem"><div><b>${s.setName||'Saved Set'}</b><div>${(s.cardIds||[]).length} cards · ${(s.hiddenCardIds||[]).length} hidden</div></div><div class="savedActions"><button onclick="loadSet('${jsq(s.id)}')">Load</button><button onclick="renameSet('${jsq(s.id)}')">Rename</button><button onclick="deleteSavedSet('${jsq(s.id)}')">Delete</button></div></div>`).join('')}</div>`:`<div class="empty">No saved sets yet.</div>`}
async function loadSet(id){const sets=await listSets(),s=sets.find(x=>x.id===id);if(!s)return;currentSetId=s.id;currentSetName=s.setName||'Saved Set';selectedOrder=[...(s.metadata?.order||s.cardIds||[])];hiddenIds=new Set(s.hiddenCardIds||[]);viewerMode='set';viewerIndex=0;toast('Set loaded');renderFCTab('viewer')}
async function renameSet(id){const sets=await listSets(),s=sets.find(x=>x.id===id);if(!s)return;const name=prompt('Rename set:',s.setName||'Saved Set');if(!name||!name.trim())return;s.setName=name.trim();await saveSetObj(s);if(currentSetId===id)currentSetName=s.setName;renderSavedSets()}
async function deleteSavedSet(id){if(!confirm('Delete this saved set?'))return;await deleteSetObj(id);if(currentSetId===id){currentSetId=null;currentSetName='Current Set'}renderSavedSets()}

function getCard(id){return ALL_CARDS.find(c=>c.id===id)||LEARN_CARDS[0]}
function taskHeader(name,instruction){return `<div class="taskHeader"><strong>${name}</strong><span>${instruction}</span><span class="pill">${taskStep+1}</span></div>`}
function taskDone(title,next='finish'){shell(title,'finish',`<div class="taskComplete"><div class="trophy">🏆</div><h2>${title}</h2><p>You completed ${taskScore} activities!</p><div class="toolbar"><button class="action green" onclick="openStage('${next}')">Continue ▶</button><button class="action purple" onclick="openFlashcards()">Review flashcards</button></div></div>`)}
function targetCards(target,pool){return pool.map(id=>{const c=getCard(id);return `<button class="pickTile" onclick="answerPicture('${jsq(id)}','${jsq(target)}',this)"><img class="protect" decoding="async" src="${c.file}" alt="Picture option"></button>`}).join('')}
function answerPicture(pick,target,el){if(taskLock)return;if(pick!==target){el.classList.add('bad');say('Try again');setTimeout(()=>el.classList.remove('bad'),700);return}taskLock=true;el.classList.add('good');taskScore++;say('Excellent!');setTimeout(()=>{taskLock=false;taskStep++;runActiveTask()},650)}
let activeTask='';
function beginTask(level,stage){activeTask=level+':'+stage;taskStep=0;taskScore=0;runActiveTask()}
function runActiveTask(){let [level,stage]=activeTask.split(':');let items=taskDeck[activeTask];if(!items)return;if(taskStep>=items.length){taskDone('Great job!',stage==='listen'?'play':stage==='play'?'practice':'finish');return}let x=items[taskStep];if(stage==='listen'){let pool=level==='2'?['08_RED_ENVELOPE','07_FIREWORKS','02_FAMILY','09_COUNTDOWN_CLOCK']:['04_HAPPY','06_LUCKY','01_NEW_YEAR'];shell('Listen','listen',`<div class="taskScreen">${taskHeader('Listen & Choose','Listen to the sentence. Tap the matching picture.')}<div class="taskBar"><button class="action green" onclick="say('${jsq(x.q)}')">🔊 Listen again</button><span>${taskStep+1} / ${items.length}</span></div><div class="taskTiles">${targetCards(x.id,pool)}</div></div>`);setTimeout(()=>say(x.q),250);return}
if(stage==='play'&&level==='2'){let c=getCard(x.id);shell('Play','play',`<div class="taskScreen">${taskHeader('New Year or Lunar New Year?','Look at the picture. Choose one celebration.')}<div class="sortTask"><img class="protect" decoding="async" src="${c.file}" alt="Sorting picture"><div><h3>${c.label}</h3><button class="action" onclick="answerCategory('New Year','${jsq(x.a)}',this)">🎆 New Year</button><button class="action orange" onclick="answerCategory('Lunar New Year','${jsq(x.a)}',this)">🧧 Lunar New Year</button></div></div></div>`);return}
if(stage==='play'&&level==='3'){shell('Play','play',`<div class="taskScreen">${taskHeader('Missing Line','Complete the conversation.')}<h2 class="dialoguePrompt">${x.q}</h2><div class="choiceList">${x.options.map(a=>`<button class="action" onclick="answerLine('${jsq(a)}','${jsq(x.a)}',this)">${a}</button>`).join('')}</div></div>`);return}}
function answerCategory(choice,correct,el){if(taskLock)return;if(choice!==correct){el.classList.add('bad');say('Try again');setTimeout(()=>el.classList.remove('bad'),600);return}taskLock=true;el.classList.add('good');taskScore++;say(choice);setTimeout(()=>{taskLock=false;taskStep++;runActiveTask()},580)}
function answerLine(choice,correct,el){if(choice!==correct){el.classList.add('bad');say('Try again');setTimeout(()=>el.classList.remove('bad'),600);return}taskScore++;el.classList.add('good');say(correct);setTimeout(()=>{taskStep++;runActiveTask()},800)}
function wishBuilder(){shell('Practice','practice',`<div class="taskScreen">${taskHeader('Build a New Year Wish','Choose a wish, listen and say it aloud.')}<h2 class="wishLine">I wish you <em id="wishWord">${chosenWish}</em>.</h2><div class="choiceList">${['happiness','good luck','a happy New Year'].map(t=>`<button class="action purple" onclick="chooseWish('${jsq(t)}')">${t}</button>`).join('')}</div><div class="taskBar"><button class="action green" onclick="say('I wish you '+chosenWish+'.')">🔊 Hear my wish</button><button class="action orange" onclick="speakWishSuccess()">✓ I said my wish</button></div></div>`)}

// Turn Music into actual low-volume instrumental audio using Web Audio; no remote assets.
// Schedule note start-times on the audio clock, independent of JS timer jitter.
let musicCtx=null,musicTimer=null,musicBeat=0,musicGain=null,musicNextTime=0;
const melody=[392,440,523.25,440,392,329.63,349.23,392,523.25,587.33,659.25,587.33,523.25,440,392,0];
function musicNote(at){
 if(!musicOn||!musicCtx)return;
 const f=melody[(musicBeat++)%melody.length];if(!f)return;
 const osc=musicCtx.createOscillator(),gain=musicCtx.createGain();
 osc.type='sine';osc.frequency.value=f;
 gain.gain.setValueAtTime(.0001,at);
 gain.gain.exponentialRampToValueAtTime(.022,at+.035);
 gain.gain.exponentialRampToValueAtTime(.0001,at+.32);
 osc.connect(gain);gain.connect(musicGain);osc.start(at);osc.stop(at+.34);
 osc.onended=()=>{osc.disconnect();gain.disconnect()};
}
function scheduleMusic(){
 if(!musicOn||!musicCtx)return;
 const now=musicCtx.currentTime;
 if(musicNextTime<now-.45)musicNextTime=now;
 while(musicNextTime<now+.22){musicNote(musicNextTime);musicNextTime+=.39}
}
toggleMusic=function(){
 musicOn=!musicOn;
 if(musicOn){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){musicOn=false;toast('Background music unavailable');return}
  if(!musicCtx){musicCtx=new AC();musicGain=musicCtx.createGain();musicGain.gain.value=.8;musicGain.connect(musicCtx.destination)}
  musicCtx.resume().catch(()=>{});musicBeat=0;musicNextTime=musicCtx.currentTime+.03;
  clearInterval(musicTimer);scheduleMusic();musicTimer=setInterval(scheduleMusic,75);
 }else{clearInterval(musicTimer);musicTimer=null;if(musicGain)musicGain.gain.setTargetAtTime(0,musicCtx.currentTime,.035)}
 if(musicOn&&musicGain)musicGain.gain.setTargetAtTime(.8,musicCtx.currentTime,.04);
 toast('Music '+(musicOn?'ON':'OFF'));
};
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopLessonSpeech();if(musicGain&&musicCtx)musicGain.gain.setTargetAtTime(0,musicCtx.currentTime,.04)}
 else if(musicGain&&musicCtx&&musicOn){musicNextTime=musicCtx.currentTime+.03;musicGain.gain.setTargetAtTime(.8,musicCtx.currentTime,.08)}
});
