<div class="app"><img id="spatialBackground" class="spatialBackground" src="assets/spatial_match/spatial_match_week1_v35.webp" alt="" aria-hidden="true"><div class="v35MaskPic" aria-hidden="true"></div><div class="v35MaskQuestion" aria-hidden="true"></div><div class="v35MaskStatus" aria-hidden="true"></div>
 <header><button id="home" class="home wood" aria-label="Return to the interactive lesson">🏠 HOME</button><div class="title wood">SPATIAL MATCH<small>WHERE IS IT? · GRADE 4 UNIT 4</small></div><button id="help" class="help">📖 HOW TO PLAY</button></header>
 <div class="tools"><div class="weekTabs" id="weekTabs" aria-label="Choose the teaching week"><button class="pill" data-week="1">WEEK 1</button><button class="pill" data-week="2">WEEK 2</button><button class="pill" data-week="3">WEEK 3</button></div><div class="teamTabs" id="teamTabs" aria-label="Team mode"><button class="pill" data-teams="1">1 TEAM</button><button class="pill" data-teams="2">2 TEAMS</button></div><div class="stat"><span id="progress">CARD 1 / 8</span><span id="totalStars">⭐ 0</span></div></div>
 <main class="main">
  <section class="cardPane" aria-label="Current flashcard"><div class="ribbon">LOOK · MATCH · SAY</div><div class="cardFrame"><img id="card" draggable="true" alt="Look at the picture and place it on the board" src=""></div><div class="ask" id="question">Where is Grandpa?</div><div class="cardBtnRow"><button id="listen" class="say">🔊 LISTEN</button><button id="next" class="next" disabled>NEXT CARD ▶</button></div><div id="status" class="status" role="status" aria-live="polite">Tap the correct square!</div></section>
  <section class="boardPane" aria-label="Matching board"><div class="boardHeading"><strong>🧩 MATCHING BOARD</strong><span class="turn a" id="turn">TEAM A · YOUR TURN</span></div><div id="gridBoard" class="gridBoard" role="group" aria-label="Select a person and position"></div></section>
 </main>
 <footer class="footer"><div id="miniScore">⭐ TEAM A 0 · TEAM B 0</div><span class="rulesHint">Look at the card → Choose the correct row and column → Say a sentence!</span><button id="classic" class="restart" hidden>🎯 CLASSIC CHALLENGE</button><button id="restart" class="restart">↻ RESTART</button></footer>
</div>
<div class="modal" id="modal" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" aria-label="Close">✕</button><h2 id="modalTitle">HOW TO PLAY</h2><div id="modalBody"></div><div class="done"><button id="doneModal">LET'S PLAY ▶</button></div></div></div>
<script>
'use strict';
// 16 exact picture-only cards from Set 3, matched to the physical teacher answer key.
const CARDS=[
{id:'A01',who:'grandpa',prep:'in',object:'soccer goal',sentence:'Grandpa is in the soccer goal.'},
{id:'A02',who:'grandpa',prep:'in',object:'gaming fort',sentence:'Grandpa is in the gaming fort.'},
{id:'A03',who:'grandma',prep:'in',object:'tunnel',sentence:'Grandma is in the tunnel.'},
{id:'A04',who:'grandma',prep:'in',object:'tent',sentence:'Grandma is in the tent.'},
{id:'B01',who:'grandpa',prep:'on',object:'scooter',sentence:'Grandpa is on the scooter.'},
{id:'B02',who:'grandpa',prep:'on',object:'bicycle',sentence:'Grandpa is on the bicycle.'},
{id:'B03',who:'grandma',prep:'on',object:'skateboard',sentence:'Grandma is on the skateboard.'},
{id:'B04',who:'grandma',prep:'on',object:'balance board',sentence:'Grandma is on the balance board.'},
{id:'C01',who:'grandpa',prep:'under',object:'bridge',sentence:'Grandpa is under the bridge.'},
{id:'C02',who:'grandpa',prep:'under',object:'tree',sentence:'Grandpa is under the tree.'},
{id:'C03',who:'grandma',prep:'under',object:'slide',sentence:'Grandma is under the slide.'},
{id:'C04',who:'grandma',prep:'under',object:'table',sentence:'Grandma is under the table.'},
{id:'D01',who:'grandpa',prep:'next to',object:'swing',sentence:'Grandpa is next to the swing.'},
{id:'D02',who:'grandpa',prep:'next to',object:'bench',sentence:'Grandpa is next to the bench.'},
{id:'D03',who:'grandma',prep:'next to',object:'trampoline',sentence:'Grandma is next to the trampoline.'},
{id:'D04',who:'grandma',prep:'next to',object:'slide',sentence:'Grandma is next to the slide.'}
];
const PREPS=['in','on','under','next to'];
const pic=id=>'assets/spatial_match/Flashcard_'+id+'.jpg';
const $=s=>document.querySelector(s);
let week=Number(new URLSearchParams(location.search).get('week'))||3;
if(![1,2,3].includes(week))week=3;
let teams=2,cards=[],index=0,placed=[],firstTry=true,answered=false,points=[0,0],turnIndex=0,soundEnabled=true;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(s){if(!soundEnabled)return;if(window.parent!==window){window.parent.postMessage({type:'g4-voice',text:String(s)},'*')}else{window.G4Voice?.play(s)}}
function getPreps(){return week===1?PREPS.slice(0,2):week===2?PREPS.slice(2):PREPS}
function teamName(){return teams===1?'CLASS':turnIndex===0?'TEAM A':'TEAM B'}
function reset(){document.querySelector('.app').dataset.week=String(week);document.querySelector('#spatialBackground').src=`assets/spatial_match/spatial_match_week${week}_v35.webp`;let preps=getPreps();cards=shuffle(CARDS.filter(c=>preps.includes(c.prep)));index=0;placed=[];firstTry=true;answered=false;points=[0,0];turnIndex=0;renderBoard();renderCard();}
function renderBoard(){const preps=getPreps(),board=$('#gridBoard');board.style.setProperty('--cols',preps.length);board.replaceChildren();const blank=document.createElement('div');blank.className='headLabel';blank.style.background='linear-gradient(#c58e5b,#a46430)';blank.textContent='WHO?';board.append(blank);
 preps.forEach(prep=>{const head=document.createElement('div');head.className='headLabel '+prep.replace(' ','-');head.textContent=prep.toUpperCase();board.append(head)});
 for(const who of ['grandpa','grandma']){const row=document.createElement('div');row.className='rowLabel';row.innerHTML='<span class="face">'+(who==='grandpa'?'👴':'👵')+'</span><span>'+who.toUpperCase()+'</span>';board.append(row);
  preps.forEach(prep=>{const b=document.createElement('button');b.type='button';b.className='slot';b.dataset.who=who;b.dataset.prep=prep;b.setAttribute('aria-label',who.toUpperCase()+' '+prep.toUpperCase());b.addEventListener('click',()=>place(who,prep,b));b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('dragOver')});b.addEventListener('dragleave',()=>b.classList.remove('dragOver'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('dragOver');place(who,prep,b)});board.append(b);});}
 renderPlaced();}
function renderPlaced(){for(const slot of document.querySelectorAll('.slot')){const matching=placed.filter(c=>c.who===slot.dataset.who&&c.prep===slot.dataset.prep);slot.replaceChildren();if(!matching.length){const hint=document.createElement('span');hint.className='hint';hint.textContent='PLACE HERE';slot.append(hint);continue;}const wrap=document.createElement('div');wrap.className='placed';matching.forEach(c=>{const img=document.createElement('img');img.src=pic(c.id);img.alt=c.who+' '+c.prep;wrap.append(img)});slot.append(wrap);const counter=document.createElement('span');counter.className='placedCount';counter.textContent=matching.length+' / 2';slot.append(counter);}}
function renderCard(){if(index>=cards.length){endRound();return;}const q=cards[index];answered=false;firstTry=true;$('#card').src=pic(q.id);$('#card').alt='Find '+q.who+' in the scene';$('#card').draggable=true;$('#question').textContent='Where is '+(q.who==='grandpa'?'Grandpa':'Grandma')+'?';$('#next').disabled=true;$('#status').textContent='Choose the correct square!';$('#status').className='status';renderStats()}
function renderStats(){const total=points[0]+points[1];$('#progress').textContent='CARD '+Math.min(index+1,cards.length)+' / '+cards.length;$('#totalStars').textContent=String(total);$('#turn').textContent=teamName()+' · YOUR TURN';$('#turn').className='turn '+(turnIndex?'b':'a');$('#miniScore').textContent=teams===1?'CLASS SCORE: '+points[0]:'TEAM A '+points[0]+' · TEAM B '+points[1];document.querySelectorAll('[data-week]').forEach(b=>b.classList.toggle('on',Number(b.dataset.week)===week));document.querySelectorAll('[data-teams]').forEach(b=>b.classList.toggle('on',Number(b.dataset.teams)===teams));$('#classic').hidden=week!==3;}
function place(who,prep,el){if(answered||index>=cards.length)return;const q=cards[index];if(q.who===who&&q.prep===prep){answered=true;placed.push(q);if(firstTry)points[turnIndex]++;renderPlaced();$('#status').textContent='✓ CORRECT! '+q.sentence;$('#status').className='status good';$('#next').disabled=false;renderStats();say(q.sentence);
 }else{firstTry=false;$('#status').textContent='Try again! Look at the person and the position.';$('#status').className='status bad';el.classList.remove('error');void el.offsetWidth;el.classList.add('error');say('Try again');}}
function nextCard(){if(!answered)return;index++;if(teams===2)turnIndex=1-turnIndex;renderCard();}
function endRound(){const scores=teams===1?'<p>Class score: <b>'+points[0]+' / '+cards.length+'</b></p>':'<p>TEAM A: <b>'+points[0]+'</b> stars &nbsp; | &nbsp; TEAM B: <b>'+points[1]+'</b> stars</p>';
 $('#modalTitle').textContent='🌟 WELL DONE!';$('#modalBody').innerHTML='<p style="text-align:center;font-size:22px;font-weight:900">You matched all '+cards.length+' picture cards!</p>'+scores+'<p class="translation" style="text-align:center">太棒了！所有圖片都配對完成！</p>';$('#doneModal').textContent='PLAY AGAIN ↻';$('#doneModal').onclick=()=>{closeModal();reset()};showModal();}
function showModal(){const m=$('#modal');m.classList.add('open');m.setAttribute('aria-hidden','false');$('#closeModal').focus()}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.setAttribute('aria-hidden','true')}
function help(){$('#modalTitle').textContent='HOW TO PLAY · 遊戲玩法';$('#modalBody').innerHTML=`<p><b>Goal:</b> Match the location picture to the correct row (Grandpa/Grandma) and column (IN, ON, UNDER, NEXT TO).</p>
<ol><li>Choose WEEK 1, WEEK 2, or WEEK 3. <div class="translation">選擇第一、第二或第三週。</div></li><li>Choose one class team or two teams. <div class="translation">選擇一隊或兩隊。</div></li><li>Look at the flashcard. Ask: “Where is Grandpa/Grandma?” <div class="translation">觀察圖片並提問：爺爺／奶奶在哪裡？</div></li><li>Tap the matching square, or drag the card onto it. <div class="translation">點選正確格子，或把圖片拖曳進格子。</div></li><li>Say the complete sentence, for example: “Grandma is under the slide.” <div class="translation">說出完整英文句子。</div></li><li>Correct on the first try earns one star. Tap NEXT CARD for the next turn. <div class="translation">第一次答對得一顆星，再按「下一張」。</div></li></ol><p><b>Week 1:</b> IN / ON (8 cards) &nbsp; <b>Week 2:</b> UNDER / NEXT TO (8 cards) &nbsp; <b>Week 3:</b> all four (16 cards).</p><p class="translation">每個格子最多放兩張卡片；答錯可以再試一次。</p>`;$('#doneModal').textContent="LET'S PLAY ▶";$('#doneModal').onclick=closeModal;showModal()}
function home(){if(window.parent!==window){window.parent.postMessage({type:'spatial-match',action:'home'},'*')}else{location.href='index.html'}}
$('#card').addEventListener('dragstart',e=>{if(index<cards.length)e.dataTransfer.setData('text/plain',cards[index].id)});$('#classic').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'spatial-match',action:'classicGame'},'*')});$('#home').addEventListener('click',home);$('#help').addEventListener('click',help);$('#restart').addEventListener('click',reset);$('#listen').addEventListener('click',()=>{if(index<cards.length)say($('#question').textContent)});$('#next').addEventListener('click',nextCard);$('#closeModal').addEventListener('click',closeModal);$('#doneModal').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>{week=Number(b.dataset.week);reset()}));document.querySelectorAll('[data-teams]').forEach(b=>b.addEventListener('click',()=>{teams=Number(b.dataset.teams);reset()}));
reset();
</script></body></html>
