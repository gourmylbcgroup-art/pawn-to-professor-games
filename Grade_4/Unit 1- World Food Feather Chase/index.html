<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Food Feather Chase</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#193259}*{box-sizing:border-box}body{margin:0;background:#84b2d6}button{font:inherit;cursor:pointer}#app{height:100dvh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at top,#dff4ff 0,#b9d9f0 28%,#6788ad 68%,#2d4462 100%)}#stage{position:relative;width:min(100vw,178dvh);aspect-ratio:16/9;max-height:100dvh;background:linear-gradient(180deg,#d7ecf9,#9fc5de 50%,#6487aa);overflow:hidden;border-radius:24px;box-shadow:0 18px 60px #0007}#back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.76;filter:blur(2px) saturate(1.05) brightness(.92)}#stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,#51320f1a 72%,#2f170733 100%)}#title{position:absolute;z-index:8;left:2.2%;top:1.7%;transform:none;padding:.42em 1em;font-size:clamp(16px,2.05vw,30px);font-weight:1000;letter-spacing:.01em;white-space:nowrap;color:#fff4b2;text-shadow:0 3px 0 #5b2f12,0 4px 10px #0006;background:linear-gradient(#7a4923,#4e2914);border:4px solid #8f5a2a;border-radius:22px;box-shadow:0 7px 0 #301507,0 10px 20px #0004;max-width:60%;overflow:hidden;text-overflow:ellipsis}#toolbar{position:absolute;z-index:12;right:1%;top:1%;display:flex;gap:6px}.tool{background:linear-gradient(#fffef2,#f8d276);color:#6b4312;border:3px solid #fff7d1;border-radius:50%;width:clamp(34px,3.8vw,54px);aspect-ratio:1;font-size:clamp(16px,2vw,25px);box-shadow:0 4px 0 #c58a28}#track,#runners{position:absolute;inset:0}#track{z-index:2}#runners{z-index:6;pointer-events:none}.space{position:absolute;transform:translate(-50%,-50%);height:clamp(62px,11.9%,118px);aspect-ratio:4/5;border-radius:15px;display:grid;place-items:center;overflow:visible;background:transparent;box-shadow:none}.space.next img{outline:5px solid #65ff8c;outline-offset:2px;box-shadow:0 0 22px 10px #6eff9a66,0 8px 16px #0005;animation:pulse 1s infinite alternate}.space img{width:100%;height:100%;object-fit:cover;border-radius:16px;box-shadow:0 7px 0 #b97e21,0 9px 16px #0005}.miniLabel{display:none}.runner{position:absolute;width:clamp(36px,4.8%,68px);transform:translate(-50%,-50%);transition:left .8s ease-in-out,top .8s ease-in-out;filter:drop-shadow(0 4px 3px #000b)}.runner img{width:100%;display:block;filter:drop-shadow(0 3px 4px #001e47b0)}.runner.moving{z-index:9;filter:drop-shadow(0 0 16px #fcfa58)!important;scale:1.15}.runner.active{filter:drop-shadow(0 0 8px #ffff49)}.runner .plabel{position:absolute;top:-17%;left:50%;transform:translateX(-50%);background:#6f4517;color:#fff8d0;border:2px solid #fff;border-radius:10px;padding:0 5px;font-size:clamp(9px,1vw,15px);font-weight:bold}.runner .feathers{position:absolute;right:-10%;bottom:-3%;background:#ffdc47;color:#4f2f05;border:2px solid white;border-radius:30px;padding:1px 5px;font-size:clamp(11px,1.2vw,18px);font-weight:1000}#center{position:absolute;z-index:4;left:50%;top:54%;transform:translate(-50%,-50%);width:42%;height:63%;background:linear-gradient(#fffef3,#f7dea0);border:6px solid #fff8d6;border-radius:44% / 49%;padding:1.9% 2.2%;box-shadow:0 14px 30px #001a3270,0 6px 0 #d8a047;display:flex;flex-direction:column;gap:1.4%}#prompt{text-align:center;color:#714611;font-size:clamp(13px,1.35vw,21px);font-weight:1000;min-height:8%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}#cards{position:relative;flex:1;min-height:0;width:100%;height:100%}.card{position:absolute;min-width:0;min-height:0;width:16%;aspect-ratio:4/5;background:url('assets/cards/card-back.webp') center/cover no-repeat;border:0;border-radius:14px;box-shadow:0 5px 0 #b97e21,0 8px 16px #0004;overflow:hidden;padding:0;transform:translate(-50%,-50%)}.card:disabled{cursor:default;opacity:.98}.card .question{display:none}.card.revealed{background:none;box-shadow:none}.card .shown{width:100%;height:100%;display:block;position:relative}.card img{width:100%;height:100%;object-fit:cover;border-radius:14px}.card .shown b{display:none}@keyframes pulse{to{scale:1.06}}#instruction{position:relative;text-align:center;color:#7c5719;font-weight:900;font-size:clamp(11px,1.05vw,17px)}#players{position:absolute;z-index:7;left:1%;bottom:1%;display:flex;gap:10px;flex-wrap:wrap;max-width:98%}.playerChip{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#fff9e6f0;border:4px solid #d8a04d;border-radius:24px;font-weight:900;font-size:clamp(15px,1.35vw,21px);box-shadow:0 4px 12px #001b42a0}.playerChip.active{border-color:#3ae982;background:white}.playerChip img{width:clamp(28px,3.2vw,44px);min-width:28px;min-height:28px}#message{position:absolute;z-index:9;bottom:9%;left:50%;transform:translateX(-50%);max-width:85%;text-align:center;color:#fffef6;background:#6f4517ea;border:3px solid #fff4c2;border-radius:18px;padding:10px 16px;font-size:clamp(13px,1.5vw,22px);font-weight:900;display:none;box-shadow:0 5px 25px #0008}#message.show{display:block}#dialog{position:absolute;inset:0;z-index:20;background:#3d2409a8;display:grid;place-items:center;padding:12px}#dialog.hidden{display:none}.panel{width:min(860px,94%);max-height:96%;overflow-y:auto;background:linear-gradient(#fffcef,#f6df9e);border:6px solid #fff8d8;border-radius:28px;padding:clamp(15px,3vw,28px);text-align:center;box-shadow:0 15px 50px #0009,0 6px 0 #d6a14a}.panel h1{font-size:clamp(23px,3.2vw,46px);margin:0 0 8px;color:#6b4312}.panel p{font-size:clamp(14px,1.7vw,23px);line-height:1.45}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{border:2px solid white;border-radius:16px;background:linear-gradient(#41bded,#196eb8);color:white;font-weight:900;padding:12px 19px;box-shadow:0 5px 0 #114575;font-size:clamp(17px,1.7vw,25px)}.btn.gold{background:linear-gradient(#ffe57a,#f6aa25);color:#593612;box-shadow:0 5px 0 #b67b17}.btn:disabled{opacity:.45}.tokenchoices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tokenchoices button{background:white;border:3px solid #b6d2ed;border-radius:15px;padding:5px;font-weight:900}.tokenchoices button:disabled{opacity:.3}.tokenchoices img{width:100%;max-height:110px;height:110px;object-fit:contain}.rules{line-height:1.6;text-align:left;font-size:clamp(13px,1.55vw,20px)}.challengePic{width:clamp(120px,16vw,180px);height:clamp(150px,20vw,225px);object-fit:contain;margin:8px auto;display:block;border:0;border-radius:18px;background:none;padding:0;box-shadow:0 7px 0 #bb7f21,0 10px 18px #0003}.challengePic img{width:100%;height:100%;object-fit:cover;border-radius:18px}.panel .challengeTitle{font-size:clamp(18px,2vw,27px);margin:7px 0 2px;color:#6b4312}.panel .challengeLabel{font-size:clamp(14px,1.5vw,20px);font-weight:900;color:#7c5719;margin:0 0 8px}.speak{background:#fff;color:#173b6c;border:3px dashed #e5b94c;border-radius:14px;padding:15px 12px;font-size:clamp(19px,2.25vw,30px);font-weight:1000;margin:12px 0;position:relative;z-index:2;line-height:1.3}.sub{color:#5d6474;font-size:clamp(11px,1.2vw,16px)!important}.confetti{font-size:44px}#live{position:absolute;left:-9999px}@media(max-width:650px){#center{width:60%;height:57%;padding:2%;top:56%}#title{left:2%;top:1.5%;transform:none;max-width:72%;font-size:clamp(12px,3.8vw,20px)}.space{border-radius:12px;height:clamp(46px,10.1%,82px)}.card{width:19%;border-radius:10px}.card img{border-radius:10px}.runner{width:clamp(30px,4.5%,52px)}#players{bottom:0}#toolbar{top:1.5%}.playerChip{padding:1px 4px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.space.featherSquare img{box-shadow:0 0 0 4px #fff9a9,0 0 18px #ffc400,0 8px 16px #0005!important}.featherMark{position:absolute;top:-8%;right:-8%;font-size:clamp(11px,1.25vw,20px);background:#fff2a4;border:2px solid #ad7206;border-radius:13px;padding:1px 4px;color:#654400;font-weight:1000;z-index:4}
</style><link rel="preload" as="image" href="assets/cards/card-back.webp"><link rel="preload" as="image" href="assets/board/board.webp"></head><body><main id="app"><div id="stage"><img id="back" src="assets/board/board.webp" alt=""><div id="title">World Food Feather Chase</div><div id="track"></div><div id="runners"></div><section id="center"><div id="prompt">Find the next matching travel card!</div><div id="cards"></div><div id="instruction">🧠 Match • Speak • Move • Earn 5 feathers to WIN!</div></section><div id="players"></div><div id="message"></div><div id="toolbar"><button class="tool" id="sound" title="Sound">🔊</button><button class="tool" id="rules" title="Rules">?</button><button class="tool" id="full" title="Fullscreen">⛶</button><button class="tool" id="restart" title="New game">↻</button></div><div id="dialog"><section class="panel" id="panel"></section></div><div id="live" aria-live="polite"></div></div></main><script>
(()=>{'use strict';
const FOOD=[{id:'sushi',name:'Sushi',image:'famous-sushi',country:'Japan',countryId:'japan',phrase:'Sushi is from Japan.'},{id:'bao',name:'Xiao Long Bao',image:'xiao-long-bao',country:'Taiwan',countryId:'taiwan',phrase:'Xiao Long Bao is from Taiwan.'},{id:'kimchi',name:'Kimchi',image:'kimchi',country:'Korea',countryId:'korea',phrase:'Kimchi is from Korea.'},{id:'burger',name:'Burgers',image:'burgers',country:'USA',countryId:'usa',phrase:'Burgers are from the USA.'}];
const COUNTRIES=[{id:'japan',name:'Japan',image:'japan',phrase:'Japan is a country.'},{id:'taiwan',name:'Taiwan',image:'taiwan',phrase:'Taiwan is a place.'},{id:'korea',name:'Korea',image:'korea',phrase:'Korea is a country.'},{id:'usa',name:'USA',image:'usa',phrase:'The USA is a country.'}];
const ITEMS=[...FOOD.map(x=>({...x,kind:'food'})),...COUNTRIES.map(x=>({...x,kind:'country'}))];
// Twelve hidden cards: four food cards appear twice and four country cards once.
// Never combine a USA flag and burger into one card.
const DECK_IDS=[...ITEMS.map(x=>x.id),...FOOD.map(x=>x.id)];
const TOKENS=[{name:'Red Chicken',img:'chicken-red',color:'#f05b53'},{name:'Blue Chicken',img:'chicken-blue',color:'#58a9ef'},{name:'Green Chicken',img:'chicken-green',color:'#75cc70'},{name:'Purple Chicken',img:'chicken-purple',color:'#b68af1'}];
const $=s=>document.querySelector(s);const track=$('#track'),runners=$('#runners'),deckEl=$('#cards'),panel=$('#panel'),dialog=$('#dialog'),prompt=$('#prompt');
let players=[],current=0,deck=[],trackIds=[],featherSquares=new Set(),phase='setup',selected=[],count=0,muted=false,waiting=false,movesThisTurn=0,win=false,toastTimeout=null,gameId=0;
const cardImg=x=>'assets/cards/'+x+'.webp';const tokenImg=x=>'assets/tokens/'+x+'.svg';const audioPath='assets/audio/voice/';let audio=null;
// Fetch each MP3 just once per page, retain its bytes in RAM, and play from a local blob URL.
// This avoids per-turn network latency. Works with 100 concurrent CDN-hosted players;
// each browser caches its own sound files. file:// browsers use normal MP3 URLs as fallback.
const SOUND_KEYS=["amazing", "correct", "country-challenge", "extra-turn", "find-burgers", "find-famous-sushi", "find-japan", "find-kimchi", "find-korea", "find-taiwan", "find-usa", "find-xiao-long-bao", "food-challenge", "good-try-next-traveler", "great-keep-traveling", "jet-boost", "keep-going", "label-burgers", "label-famous-sushi", "label-japan", "label-kimchi", "label-korea", "label-taiwan", "label-usa", "label-xiao-long-bao", "passport-bonus", "rescue-challenge", "travel-delay", "turn-p1", "turn-p2", "turn-p3", "turn-p4", "where-burgers-from", "where-famous-sushi-from", "where-kimchi-from", "where-xiao-long-bao-from", "winner-p1", "winner-p2", "winner-p3", "winner-p4", "yes-japan", "yes-korea", "yes-taiwan", "yes-usa"];
const soundURLs=new Map(),soundTasks=new Map();let soundPreloadDone=false;
async function fetchSound(key){
 if(soundURLs.has(key))return soundURLs.get(key);
 if(soundTasks.has(key))return soundTasks.get(key);
 const task=(async()=>{try{
  const res=await fetch(audioPath+key+'.mp3',{cache:'force-cache'});
  if(!res.ok)throw Error('Audio HTTP '+res.status);
  const blob=await res.blob();if(!blob.size)throw Error('Empty audio');
  const url=URL.createObjectURL(blob);soundURLs.set(key,url);return url;
 }catch(e){return audioPath+key+'.mp3';}})();
 soundTasks.set(key,task);return task;
}
const soundPreload=(async()=>{
 // Limit fetch concurrency, avoiding 44 simultaneous requests per visitor.
 let cursor=0;await Promise.all(Array.from({length:5},async()=>{
  while(cursor<SOUND_KEYS.length){const key=SOUND_KEYS[cursor++];await fetchSound(key);}
 }));soundPreloadDone=true;
})();
let voiceSequence=0;
async function voice(key){
 if(muted)return;const sequence=++voiceSequence;
 try{
  const url=await fetchSound(key);if(muted||sequence!==voiceSequence)return;
  if(!audio){audio=new Audio();audio.preload='auto';audio.volume=.88;}
  audio.pause();if(audio.src!==url)audio.src=url;
  try{audio.currentTime=0;}catch(e){}
  const result=audio.play();if(result&&result.catch)result.catch(()=>{});
 }catch(e){}
}
function stopVoice(){++voiceSequence;if(audio)audio.pause()}

let beepContext=null;function beep(ok){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!beepContext)beepContext=new C();const ctx=beepContext,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=ok?660:240;g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);o.start();o.stop(ctx.currentTime+.18);o.onended=()=>{o.disconnect();g.disconnect()};}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function item(id){return ITEMS.find(x=>x.id===id)}
function createFeatherSquares(){
 // Six feather squares with a minimum distance of three spaces around the circular board.
 const offsets=shuffle([0,1,2,3]);const offset=offsets[0];
 return new Set(Array.from({length:6},(_,i)=>(offset+4*i)%24));
}
function picture(x){return `<img src="${cardImg(x.image)}" alt="${x.name}">`}
function pos(i){let ang=2*Math.PI*(i/24)-Math.PI/2;return{x:50+45.5*Math.cos(ang),y:50+36*Math.sin(ang)}}
function point(el,i,shift=0){const p=pos(i);el.style.left=(p.x+shift)+'%';el.style.top=p.y+'%'}
function drawTrack(){track.innerHTML='';trackIds.forEach((id,i)=>{let x=item(id),el=document.createElement('div');el.className='space '+(featherSquares.has(i)?'featherSquare ':'')+(x.kind==='pair'?'pair':'');el.dataset.index=i;point(el,i);el.innerHTML=picture(x)+`<span class="miniLabel">${x.name}</span>`+(featherSquares.has(i)?'<span class="featherMark" title="Earn 1 feather">🪶+1</span>':'');track.appendChild(el)})}
function drawDeck(){const spots=[{x:26,y:24},{x:42,y:24},{x:58,y:24},{x:74,y:24},{x:26,y:50},{x:42,y:50},{x:58,y:50},{x:74,y:50},{x:26,y:76},{x:42,y:76},{x:58,y:76},{x:74,y:76}];deckEl.innerHTML='';deck.forEach((id,i)=>{let b=document.createElement('button');b.className='card';b.type='button';b.dataset.index=i;b.setAttribute('aria-label','Hidden card '+(i+1));b.innerHTML='<span class="question"></span>';const p=spots[i]||{x:50,y:50};b.style.left=p.x+'%';b.style.top=p.y+'%';b.addEventListener('click',()=>flip(i));deckEl.appendChild(b)})}
function drawPlayers(){runners.innerHTML='';$('#players').innerHTML='';players.forEach((p,i)=>{let el=document.createElement('div');el.className='runner'+(i===current?' active':'');point(el,p.pos,i%2===0?-.9:.9);el.innerHTML=`<span class="plabel">P${i+1}</span><img src="${tokenImg(p.token.img)}" alt="${p.token.name}"><span class="feathers">🪶${p.feathers}/5</span>`;runners.appendChild(el);let chip=document.createElement('div');chip.className='playerChip'+(i===current?' active':'');chip.innerHTML=`<img src="${tokenImg(p.token.img)}" alt="">P${i+1} • SPACE ${p.pos+1} • 🪶${p.feathers}/5`;$('#players').appendChild(chip)})}
function show(html){panel.innerHTML=html;dialog.classList.remove('hidden')};function hide(){dialog.classList.add('hidden')}
function notice(msg,d=1600){clearTimeout(toastTimeout);let el=$('#message');el.textContent=msg;el.classList.add('show');$('#live').textContent=msg;toastTimeout=setTimeout(()=>el.classList.remove('show'),d)}
function home(){gameId++;phase='setup';win=false;players=[];selected=[];show(`<h1>🐔 WORLD FOOD FEATHER CHASE</h1><p>Remember the pictures, race your chickens, and collect five feathers!</p><p><b>How many players?</b></p><div class="choices"><button class="btn" data-count="2">2 Players</button><button class="btn" data-count="3">3 Players</button><button class="btn" data-count="4">4 Players</button></div><p class="sub">Original food art and recorded voice reused from your uploaded game.</p>`);panel.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{count=+b.dataset.count;selectToken()})}
function selectToken(){const n=selected.length;if(n===count){start();return}show(`<h1>Player ${n+1}: Choose your Chicken</h1><div class="tokenchoices">${TOKENS.map((t,i)=>`<button data-token="${i}" ${selected.includes(i)?'disabled':''}><img src="${tokenImg(t.img)}" alt=""><div>${t.name}</div></button>`).join('')}</div>`);panel.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{selected.push(+b.dataset.token);selectToken()})}
async function start(){if(!soundPreloadDone){show('<h1>Preparing game sounds…</h1><p>Loading recorded voices once for smooth online play.</p>');await soundPreload;}gameId++;phase='play';win=false;waiting=false;movesThisTurn=0;trackIds=shuffle([...DECK_IDS,...DECK_IDS]);deck=shuffle([...DECK_IDS]);featherSquares=createFeatherSquares();players=selected.map((s,i)=>({token:TOKENS[s],pos:Math.floor(i*24/count),feathers:0}));current=0;drawTrack();drawDeck();drawPlayers();hide();newTurn()}
function newTurn(){if(win)return;waiting=false;movesThisTurn=0;drawPlayers();updatePrompt();voice('turn-p'+(current+1))}
function updatePrompt(){if(win)return;let p=players[current],next=(p.pos+1)%24,x=item(trackIds[next]);prompt.textContent=`P${current+1} • FIND: ${x.name.toUpperCase()}`;track.querySelectorAll('.space').forEach((el,i)=>el.classList.toggle('next',i===next));}
function reveal(btn,x){btn.classList.add('revealed');btn.innerHTML=`<span class="shown ${x.kind==='pair'?'pair':''}">${picture(x)}<b>${x.name}</b></span>`}
function flip(i){if(phase!=='play'||waiting||win)return;waiting=true;let id=deck[i],x=item(id),wanted=trackIds[(players[current].pos+1)%24],b=deckEl.children[i];reveal(b,x);if(id===wanted){beep(true);voice('correct');phase='speaking';const g=gameId;setTimeout(()=>{if(g===gameId)speaking(x,i)},1450)}else{beep(false);voice('good-try-next-traveler');notice('❌ Not a match. Remember this card!',2600);const g=gameId;setTimeout(()=>{if(g!==gameId)return;restore(i);current=(current+1)%players.length;phase='play';newTurn()},2600)}}
function restore(i){deckEl.children[i].classList.remove('revealed');deckEl.children[i].innerHTML='<span class="question"></span>'}
function speaking(x,i){let sentence=x.phrase;show(`<h1>✅ MATCH!</h1><div class="challengePic">${picture(x)}</div><div class="challengeLabel">${x.name}</div><div class="challengeTitle">Say this English sentence:</div><div class="speak">${sentence}</div><p class="sub">Teacher or partner checks speaking. The game cannot automatically verify pronunciation.</p><div class="choices"><button class="btn gold" id="said">🗣️ I SAID IT!</button><button class="btn" id="help">🔊 HEAR THE WORD</button><button class="btn" id="skip">Not yet — next player</button></div>`);$('#said').onclick=()=>advance(i);$('#skip').onclick=()=>{hide();restore(i);current=(current+1)%players.length;phase='play';newTurn()};$('#help').onclick=()=>voice('label-'+(x.kind==='country'?x.id:x.id==='sushi'?'famous-sushi':x.id==='bao'?'xiao-long-bao':x.id))}
function advance(i){
 // Confirm English, then move ONE space. Keep this player's turn after the animation.
 if(phase!=='speaking'||win)return;
 hide();phase='animating';waiting=true;
 const g=gameId,who=current,p=players[who];
 const from=p.pos,to=(from+1)%trackIds.length;
 p.pos=to;
 movesThisTurn++;
 const runner=runners.children[who];
 if(runner){runner.classList.add('moving');point(runner,to,who%2===0?-.9:.9);}
 notice(`✅ P${who+1} MOVES: ${from+1} → ${to+1}!`,1700);
 beep(true);
 setTimeout(()=>{
   if(g!==gameId||phase!=='animating')return;
   let taken=0;
   players.forEach((other,k)=>{
     if(k!==who&&other.pos===to&&other.feathers>0){taken++;other.feathers--;}
   });
   if(taken){p.feathers+=taken;notice(`🪶 P${who+1} steals ${taken} feather${taken===1?'':'s'}!`,2200);voice('amazing');}
   if(featherSquares.has(to)){p.feathers++;notice(`🪶 FEATHER SQUARE! P${who+1} earns +1 feather (${p.feathers}/5)`,2300);voice('amazing');}
   restore(i);
   drawPlayers();
   updatePrompt();
   if(p.feathers>=5){
     phase='victory-pending';
     setTimeout(()=>{if(g===gameId&&phase==='victory-pending')finish()},1200);
     return;
   }
   // Same player plays again; do not reset or rotate turns on a successful match.
   phase='play';waiting=false;
   if(!taken)notice(`✅ P${who+1} plays AGAIN! Find ${item(trackIds[(p.pos+1)%trackIds.length]).name}.`,2200);
 },1150);
}
function finish(){win=true;phase='winner';voice('winner-p'+(current+1));show(`<div class="confetti">🏆 🎉 🪶 🎉 🏆</div><h1>PLAYER ${current+1} WINS!</h1><img class="challengePic" src="${tokenImg(players[current].token.img)}" alt="Winning Foodie"><p>Collected 5 feathers!</p><button class="btn gold" id="again">PLAY AGAIN</button><button class="btn" id="newplayers">CHANGE PLAYERS</button>`);$('#again').onclick=()=>start();$('#newplayers').onclick=home}
$('#rules').onclick=()=>{let was=phase;show(`<h1>🐔 HOW TO PLAY</h1><div class="rules"><div>1. Choose a differently colored chicken. All chickens start with <b>0 feathers</b>.</div><div>2. Find the hidden card matching the <b>next track picture</b>.</div><div>3. Correct: say the English sentence, move forward, and <b>play again</b>. Wrong: remember the card and pass the turn.</div><div>4. Land on a <b>🪶+1 feather square</b> to collect one feather.</div><div>5. Land on another chicken to steal <b>one feather</b> if it has any.</div><div>6. The <b>first chicken with 5 feathers wins!</b></div><div>7. Play Again shuffles the board and hidden cards into a new arrangement.</div></div><button class="btn" id="close">BACK TO GAME</button>`);$('#close').onclick=()=>{if(was==='setup')home();else if(was==='winner')finish();else hide()}};
$('#restart').onclick=()=>{if(confirm('Restart with the same chickens and reshuffle everything?'))start()};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'🔊';if(muted)stopVoice()};$('#full').onclick=()=>{if(!document.fullscreenElement)$('#stage').requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()};
window.addEventListener('pagehide',()=>{stopVoice();for(const url of soundURLs.values())URL.revokeObjectURL(url)});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&phase==='play')hide()});home();
})();</script></body></html>
